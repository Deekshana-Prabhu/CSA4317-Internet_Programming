<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>VELOCITY – SMART BIKE SHOWROOM (HTML Frameset Assignment Version)</title>
</head>

<!-- 
  ==========================================================================
  TRADITIONAL THREE-FRAME STRUCTURE (HTML 4.01 Frameset Requirement):
  - TOP FRAME: Showroom logo, VELOCITY name and tagline.
  - LEFT FRAME: Vertical sidebar containing bike brand hyperlinks.
  - RIGHT FRAME: Main content displaying selected bike brands, models & specs.
  
  Nested frameset:
  - Outer frameset rows="95,*" splits top header from main area.
  - Inner frameset cols="270,*" splits left sidebar from right main content.
  ==========================================================================
-->
<frameset rows="95,*" frameborder="1" border="2" framespacing="1" bordercolor="#e63946">
  <!-- TOP FRAME -->
  <frame name="topFrame" src="header.html" scrolling="no" noresize="noresize" marginwidth="0" marginheight="0">

  <!-- NESTED FRAMESET FOR LEFT AND RIGHT -->
  <frameset cols="270,*" frameborder="1" border="2" framespacing="1" bordercolor="#2d3748">
    <!-- LEFT FRAME -->
    <frame name="leftFrame" src="brands.html" scrolling="auto" marginwidth="10" marginheight="10">
    <!-- RIGHT FRAME -->
    <frame name="mainFrame" src="content.html" scrolling="auto" marginwidth="16" marginheight="16">
  </frameset>

  <!-- Fallback for modern environments without frameset support -->
  <noframes>
    <body style="font-family: sans-serif; background: #0f1216; color: #fff; padding: 40px; text-align: center;">
      <h2>VELOCITY – SMART BIKE SHOWROOM</h2>
      <p>Your browser environment does not support HTML &lt;frameset&gt; rendering.</p>
      <p><a href="index.html" style="color: #ff6b35; font-size: 18px; font-weight: bold;">Click here to open the Modern Three-Frame Showroom Application</a></p>
    </body>
  </noframes>
</frameset>
</html>
