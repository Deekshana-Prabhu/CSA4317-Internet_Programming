<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <radialGradient id="breadBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="70%" stop-color="#FDF3E7" />
      <stop offset="100%" stop-color="#F5E4D0" />
    </radialGradient>
    <linearGradient id="crustDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1A262" />
      <stop offset="40%" stop-color="#C86A2B" />
      <stop offset="100%" stop-color="#803D14" />
    </linearGradient>
    <linearGradient id="baguetteCrust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9965B" />
      <stop offset="50%" stop-color="#D97736" />
      <stop offset="100%" stop-color="#B8591B" />
    </linearGradient>
    <linearGradient id="crumbLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF5" />
      <stop offset="100%" stop-color="#F5E8D3" />
    </linearGradient>
    <filter id="breadShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5C341D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#breadBg)"/>

  <!-- Linen Baker's Cloth / Board -->
  <g filter="url(#breadShadow)">
    <rect x="70" y="320" width="460" height="60" rx="8" fill="#E2CFBA"/>
    <!-- Linen napkin drape -->
    <path d="M120 320 L180 320 L160 380 L90 380 Z" fill="#FFFBF5" opacity="0.85"/>
    <path d="M140 320 L145 380" stroke="#E88D7D" stroke-width="1.5" stroke-dasharray="2 3"/>
  </g>

  <!-- Golden Wheat Stalks at background -->
  <g fill="#D99B52" opacity="0.6" transform="translate(480, 160) rotate(35)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="#C48238" stroke-width="2.5"/>
    <!-- Kernels -->
    <ellipse cx="-8" cy="20" rx="6" ry="12" transform="rotate(-30 -8 20)"/>
    <ellipse cx="8" cy="35" rx="6" ry="12" transform="rotate(30 8 35)"/>
    <ellipse cx="-8" cy="50" rx="6" ry="12" transform="rotate(-30 -8 50)"/>
    <ellipse cx="8" cy="65" rx="6" ry="12" transform="rotate(30 8 65)"/>
    <ellipse cx="-8" cy="80" rx="6" ry="12" transform="rotate(-30 -8 80)"/>
    <ellipse cx="8" cy="95" rx="6" ry="12" transform="rotate(30 8 95)"/>
    <ellipse cx="0" cy="8" rx="5" ry="12"/>
  </g>

  <!-- French Baguette (Leaning angled in background) -->
  <g transform="translate(180, 120) rotate(-28)" filter="url(#breadShadow)">
    <rect x="-30" y="-120" width="60" height="340" rx="30" fill="url(#baguetteCrust)"/>
    <!-- Crisp diagonal slash scores -->
    <ellipse cx="0" cy="-60" rx="20" ry="8" fill="url(#crumbLight)" transform="rotate(25 0 -60)"/>
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="url(#crumbLight)" transform="rotate(25 0 0)"/>
    <ellipse cx="0" cy="60" rx="22" ry="9" fill="url(#crumbLight)" transform="rotate(25 0 60)"/>
    <ellipse cx="0" cy="120" rx="20" ry="8" fill="url(#crumbLight)" transform="rotate(25 0 120)"/>
    <ellipse cx="0" cy="175" rx="16" ry="7" fill="url(#crumbLight)" transform="rotate(25 0 175)"/>
  </g>

  <!-- Artisan Sourdough Boule (Center Main) -->
  <g transform="translate(320, 240)" filter="url(#breadShadow)">
    <!-- Round Boule Body -->
    <ellipse cx="0" cy="40" rx="145" ry="85" fill="url(#crustDark)"/>
    <ellipse cx="0" cy="25" rx="138" ry="75" fill="#E88D48"/>
    
    <!-- White Flour Dusting Patches on Crust -->
    <path d="M-90 10 Q -30 -20 20 5 Q 80 15 110 30 Q 50 65 -40 55 Z" fill="#FFFDF9" opacity="0.3"/>
    
    <!-- Deep Artisan Wheat Ear Scoring in Crust -->
    <!-- Main curved score -->
    <path d="M-80 35 Q 0 -15 80 35" stroke="#FFF5E5" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-78 35 Q 0 -13 78 35" stroke="#FFE7C4" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Wheat leaf sub-scores -->
    <path d="M-45 5 Q -30 -10 -25 -25" stroke="#FFF5E5" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M-15 0 Q 0 -20 5 -35" stroke="#FFF5E5" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M25 5 Q 35 -15 45 -25" stroke="#FFF5E5" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Multigrain Loaf Slice with Seeds (Front Left) -->
  <g transform="translate(145, 290)" filter="url(#breadShadow)">
    <!-- Crust edge -->
    <path d="M-50 40 C-60 10, -50 -40, -10 -55 C20 -60, 45 -35, 45 40 Z" fill="#753C16"/>
    <!-- Soft Crumb center -->
    <path d="M-44 38 C-52 12, -44 -34, -8 -48 C16 -52, 38 -30, 38 38 Z" fill="url(#crumbLight)"/>
    <!-- Air pockets / open crumb structure -->
    <circle cx="-15" cy="-20" r="4.5" fill="#E2CFBA"/>
    <circle cx="10" cy="-10" r="5" fill="#E2CFBA"/>
    <circle cx="-5" cy="10" r="6" fill="#E2CFBA"/>
    <circle cx="15" cy="18" r="4" fill="#E2CFBA"/>
    <circle cx="-25" cy="5" r="3.5" fill="#E2CFBA"/>
    <!-- Seeds on Crust (Sesame & Poppy seeds) -->
    <ellipse cx="-20" cy="-52" rx="2" ry="3.5" fill="#F4A261" transform="rotate(35 -20 -52)"/>
    <ellipse cx="5" cy="-56" rx="2" ry="3.5" fill="#F4A261" transform="rotate(-20 5 -56)"/>
    <ellipse cx="25" cy="-45" rx="2" ry="3.5" fill="#F4A261" transform="rotate(45 25 -45)"/>
    <circle cx="-32" cy="-40" r="1.5" fill="#2C1810"/>
    <circle cx="-5" cy="-50" r="1.5" fill="#2C1810"/>
    <circle cx="15" cy="-52" r="1.5" fill="#2C1810"/>
  </g>

  <!-- Badge label -->
  <g transform="translate(480, 45)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#E88D7D"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">NATURAL 24H</text>
  </g>
</svg>