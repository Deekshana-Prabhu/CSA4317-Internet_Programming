<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <radialGradient id="storyBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="65%" stop-color="#FDF3E7" />
      <stop offset="100%" stop-color="#F6E4D1" />
    </radialGradient>
    <filter id="storyShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5C341D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#storyBg)"/>

  <!-- Warm Wooden Table Base -->
  <g filter="url(#storyShadow)">
    <rect x="50" y="320" width="500" height="60" rx="8" fill="#8C5832"/>
    <rect x="50" y="320" width="500" height="10" fill="#A86E43"/>
    <!-- Wood grain lines -->
    <line x1="80" y1="340" x2="520" y2="340" stroke="#754726" stroke-width="2"/>
    <line x1="120" y1="360" x2="480" y2="360" stroke="#754726" stroke-width="2"/>
  </g>

  <!-- Open Heirloom Recipe Book (Left) -->
  <g transform="translate(180, 240)" filter="url(#storyShadow)">
    <!-- Book Cover -->
    <path d="M-130 50 L-130 -40 Q 0 -60 0 -40 L0 50 Z" fill="#6A3617"/>
    <path d="M130 50 L130 -40 Q 0 -60 0 -40 L0 50 Z" fill="#6A3617"/>
    <!-- Pages Left -->
    <path d="M-125 45 L-125 -42 Q 0 -58 0 -38 L0 45 Z" fill="#FFFDF8"/>
    <!-- Pages Right -->
    <path d="M125 45 L125 -42 Q 0 -58 0 -38 L0 45 Z" fill="#FFFBF2"/>
    <!-- Page Lines & Handwritten Recipe Illustration -->
    <text x="-65" y="-15" font-family="'Playfair Display', serif" font-size="11" fill="#4A2E1B" font-style="italic" text-anchor="middle">Grandma's Sourdough</text>
    <line x1="-110" y1="5" x2="-20" y2="5" stroke="#C5A880" stroke-width="1.5"/>
    <line x1="-110" y1="18" x2="-20" y2="18" stroke="#C5A880" stroke-width="1.5"/>
    <line x1="-110" y1="31" x2="-40" y2="31" stroke="#C5A880" stroke-width="1.5"/>

    <text x="65" y="-15" font-family="'Playfair Display', serif" font-size="11" fill="#E88D7D" font-style="italic" text-anchor="middle">Artisan Secret (1942)</text>
    <line x1="20" y1="5" x2="110" y2="5" stroke="#C5A880" stroke-width="1.5"/>
    <line x1="20" y1="18" x2="110" y2="18" stroke="#C5A880" stroke-width="1.5"/>
    <line x1="20" y1="31" x2="80" y2="31" stroke="#C5A880" stroke-width="1.5"/>
    <!-- Ribbon bookmark -->
    <path d="M0 -40 Q 15 20 25 70 L 15 65 L 5 70 Z" fill="#E88D7D"/>
  </g>

  <!-- Mason Jar with Heirloom Sourdough Starter (Bubbling with Life) -->
  <g transform="translate(420, 220)" filter="url(#storyShadow)">
    <!-- Glass Jar -->
    <rect x="-45" y="-60" width="90" height="120" rx="14" fill="#FFFFFF" fill-opacity="0.3" stroke="#D9C5B2" stroke-width="3"/>
    <!-- Sourdough Starter in Jar -->
    <path d="M-42 0 Q -20 15 0 0 Q 20 -15 42 0 L 42 55 C 42 58, -42 58, -42 55 Z" fill="#F8E7D1"/>
    <!-- Bubbles -->
    <circle cx="-20" cy="18" r="4.5" fill="#EAD2B8"/>
    <circle cx="10" cy="25" r="6" fill="#EAD2B8"/>
    <circle cx="-5" cy="38" r="5" fill="#EAD2B8"/>
    <circle cx="22" cy="12" r="3.5" fill="#EAD2B8"/>
    <!-- Jar Neck & Cloth Lid tied with twine -->
    <rect x="-35" y="-70" width="70" height="12" rx="3" fill="#D9C5B2"/>
    <path d="M-42 -72 C-30 -90, 30 -90, 42 -72 Z" fill="#FAF1E6" stroke="#E88D7D" stroke-width="1.5"/>
    <line x1="-40" y1="-68" x2="40" y2="-68" stroke="#8C5832" stroke-width="2.5"/>
    <!-- Label on Jar -->
    <rect x="-30" y="10" width="60" height="30" rx="3" fill="#FFFDF8" stroke="#D4BEA8" stroke-width="1"/>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#4A2E1B" text-anchor="middle" font-weight="bold">STARTER</text>
    <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#E88D7D" text-anchor="middle">EST. 2012</text>
  </g>

  <!-- Wooden Rolling Pin in Front -->
  <g transform="translate(300, 310) rotate(-6)" filter="url(#storyShadow)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#D97736"/>
    <!-- Handles -->
    <rect x="-180" y="-6" width="42" height="12" rx="6" fill="#A85720"/>
    <rect x="138" y="-6" width="42" height="12" rx="6" fill="#A85720"/>
  </g>

  <!-- Subtle Floating Flour Particles -->
  <circle cx="120" cy="120" r="2.5" fill="#FFFFFF"/>
  <circle cx="180" cy="90" r="3" fill="#FFFFFF"/>
  <circle cx="380" cy="80" r="3.5" fill="#FFFFFF"/>
  <circle cx="480" cy="110" r="2" fill="#FFFFFF"/>
</svg>