<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="50%" stop-color="#E88D7D" />
      <stop offset="100%" stop-color="#C85A32" />
    </linearGradient>
    <linearGradient id="chocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E1B" />
      <stop offset="100%" stop-color="#2C1810" />
    </linearGradient>
  </defs>
  <!-- Outer decorative circle -->
  <circle cx="50" cy="50" r="46" fill="#FFF8F0" stroke="#E88D7D" stroke-width="2.5" stroke-dasharray="2 3"/>
  <circle cx="50" cy="50" r="41" fill="url(#chocGrad)"/>
  
  <!-- Wheat Stalks Left & Right -->
  <g fill="#F4A261" opacity="0.9">
    <!-- Left Wheat -->
    <path d="M30 65 Q 26 50 34 38 Q 30 45 32 55 Z"/>
    <path d="M28 52 C 24 49 22 42 27 39 C 30 42 30 48 28 52 Z"/>
    <path d="M30 43 C 27 39 26 33 32 31 C 34 34 33 40 30 43 Z"/>
    <path d="M33 35 C 31 30 32 25 37 24 C 38 28 36 33 33 35 Z"/>
    <!-- Right Wheat -->
    <path d="M70 65 Q 74 50 66 38 Q 70 45 68 55 Z"/>
    <path d="M72 52 C 76 49 78 42 73 39 C 70 42 70 48 72 52 Z"/>
    <path d="M70 43 C 73 39 74 33 68 31 C 66 34 67 40 70 43 Z"/>
    <path d="M67 35 C 69 30 68 25 63 24 C 62 28 64 33 67 35 Z"/>
  </g>

  <!-- Chef toque / Croissant Baker Icon -->
  <g transform="translate(50, 44)">
    <!-- Golden Croissant / Bread Heart -->
    <path d="M -16 6 C -18 -8, -6 -16, 0 -16 C 6 -16, 18 -8, 16 6 C 10 12, -10 12, -16 6 Z" fill="url(#goldGrad)" stroke="#FFE5D9" stroke-width="1.2"/>
    <!-- Sourdough score lines -->
    <path d="M -8 -4 Q 0 -10 8 -4" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M -11 3 Q 0 -3 11 3" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Rolling Pin -->
  <g transform="translate(50, 60)">
    <rect x="-18" y="-3" width="36" height="6" rx="3" fill="#E88D7D"/>
    <!-- Handles -->
    <rect x="-24" y="-1.5" width="6" height="3" rx="1.5" fill="#F4A261"/>
    <rect x="18" y="-1.5" width="6" height="3" rx="1.5" fill="#F4A261"/>
  </g>

  <!-- Sparkles -->
  <circle cx="50" cy="20" r="2" fill="#FFE5D9"/>
  <circle cx="38" cy="22" r="1.2" fill="#FFE5D9"/>
  <circle cx="62" cy="22" r="1.2" fill="#FFE5D9"/>
</svg>