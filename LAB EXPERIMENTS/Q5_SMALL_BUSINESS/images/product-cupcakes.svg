<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <radialGradient id="cupcakeBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="70%" stop-color="#FDF0EB" />
      <stop offset="100%" stop-color="#F7DFD6" />
    </radialGradient>
    <linearGradient id="chocCup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A341E" />
      <stop offset="100%" stop-color="#3B1E0E" />
    </linearGradient>
    <linearGradient id="pinkSwirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFECE8" />
      <stop offset="50%" stop-color="#FCA699" />
      <stop offset="100%" stop-color="#E88D7D" />
    </linearGradient>
    <linearGradient id="caramelSwirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E2" />
      <stop offset="50%" stop-color="#F4A261" />
      <stop offset="100%" stop-color="#D97736" />
    </linearGradient>
    <linearGradient id="creamSwirl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FCEEE6" />
      <stop offset="100%" stop-color="#EED7CE" />
    </linearGradient>
    <filter id="cupShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5C341D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#cupcakeBg)"/>

  <!-- Sprinkle background accents -->
  <g fill="#E88D7D" opacity="0.3">
    <circle cx="100" cy="80" r="4"/>
    <circle cx="500" cy="70" r="5"/>
    <rect x="70" y="280" width="8" height="3" rx="1.5" transform="rotate(30 74 281)"/>
    <rect x="520" y="310" width="8" height="3" rx="1.5" transform="rotate(-40 524 311)"/>
    <rect x="490" y="160" width="9" height="3" rx="1.5" transform="rotate(15 494 161)"/>
  </g>

  <!-- Wooden Cutting Board / Slate -->
  <g filter="url(#cupShadow)">
    <ellipse cx="300" cy="350" rx="250" ry="32" fill="#D4C0AB"/>
    <ellipse cx="300" cy="344" rx="246" ry="28" fill="#FFF8F0"/>
    <ellipse cx="300" cy="342" rx="240" ry="25" fill="#FAF1E6"/>
  </g>

  <!-- CUPCAKE 1: Left - Salted Caramel Butterscotch -->
  <g transform="translate(150, 240)" filter="url(#cupShadow)">
    <!-- Cup Liner Plisse -->
    <path d="M-45 70 L-60 -5 L60 -5 L45 70 Z" fill="#F4D3BC" stroke="#DCA27C" stroke-width="1.5"/>
    <!-- Liner ridges -->
    <line x1="-35" y1="70" x2="-45" y2="-5" stroke="#C88E68" stroke-width="1.5"/>
    <line x1="-15" y1="70" x2="-20" y2="-5" stroke="#C88E68" stroke-width="1.5"/>
    <line x1="5" y1="70" x2="5" y2="-5" stroke="#C88E68" stroke-width="1.5"/>
    <line x1="25" y1="70" x2="30" y2="-5" stroke="#C88E68" stroke-width="1.5"/>
    <!-- Sponge dome -->
    <ellipse cx="0" cy="-5" rx="60" ry="20" fill="#D97736"/>
    <!-- Frosting Swirl -->
    <path d="M-55 -10 C-65 -45, -20 -60, 0 -60 C20 -60, 65 -45, 55 -10 C45 0, -45 0, -55 -10 Z" fill="url(#caramelSwirl)"/>
    <path d="M-40 -40 C-45 -75, -15 -85, 0 -85 C15 -85, 45 -75, 40 -40 Z" fill="url(#caramelSwirl)"/>
    <path d="M-22 -75 C-25 -105, 0 -115, 0 -115 C0 -115, 25 -105, 22 -75 Z" fill="#FFE2B8"/>
    <!-- Caramel Drip & Nut sprinkles -->
    <path d="M-15 -65 Q 0 -50 15 -65" stroke="#8C4718" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="-10" y="-85" width="5" height="5" rx="1" fill="#4A2610"/>
    <rect x="8" y="-75" width="4" height="4" rx="1" fill="#4A2610"/>
    <rect x="-2" y="-95" width="5" height="4" rx="1" fill="#4A2610"/>
  </g>

  <!-- CUPCAKE 2: Center - Signature Strawberry Rosette (Hero) -->
  <g transform="translate(300, 220)" filter="url(#cupShadow)">
    <!-- Gold Foil Liner -->
    <path d="M-50 85 L-70 -5 L70 -5 L50 85 Z" fill="#FDE2DC" stroke="#E88D7D" stroke-width="2"/>
    <line x1="-38" y1="85" x2="-52" y2="-5" stroke="#E88D7D" stroke-width="2"/>
    <line x1="-18" y1="85" x2="-25" y2="-5" stroke="#E88D7D" stroke-width="2"/>
    <line x1="2" y1="85" x2="2" y2="-5" stroke="#E88D7D" stroke-width="2"/>
    <line x1="22" y1="85" x2="28" y2="-5" stroke="#E88D7D" stroke-width="2"/>
    <line x1="40" y1="85" x2="52" y2="-5" stroke="#E88D7D" stroke-width="2"/>
    <!-- Rich chocolate base -->
    <ellipse cx="0" cy="-5" rx="70" ry="22" fill="#4A2E1B"/>
    <!-- Tall Pink Swirl Frosting -->
    <path d="M-68 -15 C-80 -55, -25 -70, 0 -70 C25 -70, 80 -55, 68 -15 C55 -3, -55 -3, -68 -15 Z" fill="url(#pinkSwirl)"/>
    <path d="M-52 -50 C-60 -90, -18 -105, 0 -105 C18 -105, 60 -90, 52 -50 Z" fill="url(#pinkSwirl)"/>
    <path d="M-35 -90 C-40 -125, -10 -135, 0 -135 C10 -135, 40 -125, 35 -90 Z" fill="#FFECE8"/>
    <!-- Strawberry on top -->
    <path d="M-10 -138 C-16 -160, 16 -160, 10 -138 C5 -128, -5 -128, -10 -138 Z" fill="#E63946"/>
    <polygon points="-4,-155 0,-162 4,-155 6,-158 2,-164 -2,-164 -6,-158" fill="#2D6A4F"/>
    <!-- Colorful Sprinkles -->
    <rect x="-35" y="-55" width="8" height="3" rx="1.5" fill="#F4A261" transform="rotate(20 -31 -53)"/>
    <rect x="25" y="-60" width="8" height="3" rx="1.5" fill="#FFFFFF" transform="rotate(-30 29 -58)"/>
    <rect x="-18" y="-95" width="7" height="3" rx="1.5" fill="#E88D7D" transform="rotate(-15 -14 -93)"/>
    <rect x="15" y="-90" width="7" height="3" rx="1.5" fill="#F4A261" transform="rotate(40 18 -88)"/>
  </g>

  <!-- CUPCAKE 3: Right - Belgian Double Chocolate & Vanilla Crème -->
  <g transform="translate(450, 240)" filter="url(#cupShadow)">
    <path d="M-45 70 L-60 -5 L60 -5 L45 70 Z" fill="#4A2E1B" stroke="#31190B" stroke-width="1.5"/>
    <line x1="-35" y1="70" x2="-45" y2="-5" stroke="#31190B" stroke-width="1.5"/>
    <line x1="-15" y1="70" x2="-20" y2="-5" stroke="#31190B" stroke-width="1.5"/>
    <line x1="5" y1="70" x2="5" y2="-5" stroke="#31190B" stroke-width="1.5"/>
    <line x1="25" y1="70" x2="30" y2="-5" stroke="#31190B" stroke-width="1.5"/>
    <ellipse cx="0" cy="-5" rx="60" ry="20" fill="#31190B"/>
    <!-- Vanilla Frosting Swirl -->
    <path d="M-55 -10 C-65 -45, -20 -60, 0 -60 C20 -60, 65 -45, 55 -10 C45 0, -45 0, -55 -10 Z" fill="url(#creamSwirl)"/>
    <path d="M-40 -40 C-45 -75, -15 -85, 0 -85 C15 -85, 45 -75, 40 -40 Z" fill="url(#creamSwirl)"/>
    <path d="M-22 -75 C-25 -105, 0 -115, 0 -115 C0 -115, 25 -105, 22 -75 Z" fill="#FFFFFF"/>
    <!-- Chocolate Roll wafer sticking out -->
    <g transform="rotate(25 15 -85)">
      <rect x="12" y="-120" width="10" height="60" rx="3" fill="#3B1E0E"/>
      <line x1="12" y1="-105" x2="22" y2="-100" stroke="#FAF5EE" stroke-width="1.5"/>
      <line x1="12" y1="-85" x2="22" y2="-80" stroke="#FAF5EE" stroke-width="1.5"/>
    </g>
    <!-- Chocolate curls -->
    <path d="M-15 -70 Q -8 -80 0 -72" stroke="#3B1E0E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Badge label -->
  <g transform="translate(480, 45)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#F4A261"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">BESTSELLER</text>
  </g>
</svg>