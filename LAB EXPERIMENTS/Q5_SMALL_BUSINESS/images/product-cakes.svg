<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <radialGradient id="cakeBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFF8F0" />
      <stop offset="65%" stop-color="#FCEEE6" />
      <stop offset="100%" stop-color="#F5DFD5" />
    </radialGradient>
    <linearGradient id="chocLayers" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A1F10" />
      <stop offset="50%" stop-color="#552F1A" />
      <stop offset="100%" stop-color="#3A1F10" />
    </linearGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3ECE4" />
      <stop offset="50%" stop-color="#E5D6C5" />
      <stop offset="100%" stop-color="#D4C0AB" />
    </linearGradient>
    <filter id="cakeShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5C341D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="420" fill="url(#cakeBg)"/>

  <!-- Delicate background flour and sparkle specks -->
  <g fill="#E88D7D" opacity="0.35">
    <circle cx="80" cy="70" r="4"/>
    <circle cx="520" cy="90" r="5"/>
    <circle cx="480" cy="340" r="3.5"/>
    <circle cx="110" cy="320" r="3"/>
    <polygon points="530,60 533,67 540,70 533,73 530,80 527,73 520,70 527,67"/>
    <polygon points="90,130 92,135 97,137 92,139 90,144 88,139 83,137 88,135"/>
  </g>

  <!-- Pedestal Cake Stand -->
  <g filter="url(#cakeShadow)">
    <ellipse cx="300" cy="360" rx="140" ry="22" fill="#CFBEAC"/>
    <ellipse cx="300" cy="354" rx="136" ry="18" fill="url(#goldPlate)"/>
    <path d="M285 354 L275 390 L325 390 L315 354 Z" fill="#BFAF9B"/>
    <ellipse cx="300" cy="390" rx="60" ry="10" fill="#9C8974"/>
  </g>

  <!-- Cake Structure -->
  <g filter="url(#cakeShadow)">
    <!-- Bottom Layer -->
    <rect x="180" y="240" width="240" height="85" rx="12" fill="url(#chocLayers)"/>
    <ellipse cx="300" cy="240" rx="120" ry="24" fill="#6A3D22"/>

    <!-- Vanilla Mascarpone Cream Filling Line -->
    <ellipse cx="300" cy="285" rx="120" ry="22" fill="#FFFDF9" stroke="#E88D7D" stroke-width="1.5"/>

    <!-- Top Cake Layer -->
    <rect x="215" y="150" width="170" height="75" rx="10" fill="url(#chocLayers)"/>
    <ellipse cx="300" cy="150" rx="85" ry="18" fill="#6A3D22"/>

    <!-- Chocolate Ganache Drip (Top to Mid) -->
    <path d="M215 150 
             Q 225 180 230 160 
             Q 240 195 248 165 
             Q 260 205 270 170 
             Q 285 210 295 175 
             Q 310 208 320 170 
             Q 335 200 345 165 
             Q 360 190 370 160 
             Q 380 180 385 150
             L 385 150 C 385 140, 215 140, 215 150 Z" 
          fill="#311A0D"/>

    <!-- Soft Berry Glaze on top -->
    <ellipse cx="300" cy="148" rx="83" ry="16" fill="#422110"/>

    <!-- Piped Buttercream Rosettes on Top -->
    <g fill="#FDECE9" stroke="#E88D7D" stroke-width="1.2">
      <ellipse cx="240" cy="145" rx="14" ry="10"/>
      <ellipse cx="270" cy="142" rx="14" ry="10"/>
      <ellipse cx="300" cy="140" rx="15" ry="11"/>
      <ellipse cx="330" cy="142" rx="14" ry="10"/>
      <ellipse cx="360" cy="145" rx="14" ry="10"/>
    </g>

    <!-- Fresh Strawberries & Raspberries Topper -->
    <!-- Strawberry 1 -->
    <path d="M285 125 C 280 105, 305 105, 305 125 C 300 135, 290 135, 285 125 Z" fill="#E63946"/>
    <path d="M292 108 L296 102 L298 108 L304 105 L300 110" stroke="#2D6A4F" stroke-width="2" fill="none"/>
    <!-- Strawberry 2 -->
    <path d="M312 128 C 308 112, 330 112, 328 128 C 324 136, 316 136, 312 128 Z" fill="#D62828"/>
    <path d="M318 114 L322 108 L324 114" stroke="#2D6A4F" stroke-width="2" fill="none"/>
    <!-- Blueberries -->
    <circle cx="260" cy="138" r="6" fill="#3D3A68"/>
    <circle cx="275" cy="134" r="5" fill="#4B4782"/>
    <circle cx="344" cy="136" r="6" fill="#3D3A68"/>
  </g>

  <!-- Gold Leaf Accent flakes -->
  <polygon points="290,170 293,174 288,176" fill="#F4A261"/>
  <polygon points="325,180 330,183 327,187" fill="#F4A261"/>
  <polygon points="255,270 260,273 257,278" fill="#F4A261"/>
  <polygon points="340,265 345,268 342,274" fill="#F4A261"/>

  <!-- Badge label -->
  <g transform="translate(470, 45)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#E88D7D"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">SIGNATURE</text>
  </g>
</svg>