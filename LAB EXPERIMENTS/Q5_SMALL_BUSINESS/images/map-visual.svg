<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3D1D0E" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="pinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E88D7D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E88D7D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Map Base / Land -->
  <rect width="800" height="450" fill="#F4ECE1"/>

  <!-- City Blocks / Buildings -->
  <g fill="#EADBCE" stroke="#DFCFBE" stroke-width="2">
    <!-- Block NW -->
    <rect x="40" y="40" width="180" height="110" rx="8"/>
    <!-- Block N Central -->
    <rect x="260" y="40" width="190" height="110" rx="8"/>
    <!-- Block NE -->
    <rect x="490" y="40" width="270" height="110" rx="8"/>

    <!-- Block W Mid -->
    <rect x="40" y="190" width="180" height="90" rx="8"/>
    <!-- Block E Mid -->
    <rect x="520" y="190" width="240" height="90" rx="8"/>

    <!-- Block SW -->
    <rect x="40" y="320" width="200" height="90" rx="8"/>
    <!-- Block S Central -->
    <rect x="280" y="320" width="200" height="90" rx="8"/>
    <!-- Block SE -->
    <rect x="520" y="320" width="240" height="90" rx="8"/>
  </g>

  <!-- Green Park (Baker's Square Greenery) -->
  <g>
    <rect x="260" y="190" width="220" height="90" rx="12" fill="#D8E8D5" stroke="#BFD9BB" stroke-width="2"/>
    <!-- Trees in Park -->
    <circle cx="290" cy="220" r="14" fill="#81C784"/>
    <circle cx="330" cy="245" r="16" fill="#66BB6A"/>
    <circle cx="380" cy="225" r="18" fill="#4CAF50"/>
    <circle cx="430" cy="250" r="15" fill="#81C784"/>
    <!-- Fountain / Walking Path -->
    <circle cx="360" cy="235" r="8" fill="#B3E5FC" stroke="#81D4FA" stroke-width="2"/>
    <text x="360" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#388E3C" text-anchor="middle">Baker's Green Square</text>
  </g>

  <!-- Roads / Streets -->
  <!-- Horizontal Avenues -->
  <rect x="0" y="155" width="800" height="30" fill="#FFFFFF"/>
  <line x1="0" y1="170" x2="800" y2="170" stroke="#F4A261" stroke-width="2" stroke-dasharray="10 10"/>

  <rect x="0" y="285" width="800" height="30" fill="#FFFFFF"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#E88D7D" stroke-width="2" stroke-dasharray="10 10"/>

  <!-- Vertical Boulevards -->
  <rect x="225" y="0" width="30" height="450" fill="#FFFFFF"/>
  <line x1="240" y1="0" x2="240" y2="450" stroke="#F4A261" stroke-width="2" stroke-dasharray="10 10"/>

  <rect x="485" y="0" width="30" height="450" fill="#FFFFFF"/>
  <line x1="500" y1="0" x2="500" y2="450" stroke="#E88D7D" stroke-width="2" stroke-dasharray="10 10"/>

  <!-- Street Labels -->
  <text x="130" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#6B5244" letter-spacing="1">CHESTNUT AVENUE</text>
  <text x="630" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#6B5244" letter-spacing="1">HARVEST WAY</text>
  <text x="620" y="304" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#6B5244" letter-spacing="1">PATISSERIE LANE</text>

  <g transform="translate(235, 100) rotate(90)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#E88D7D" letter-spacing="1">ARTISAN BOULEVARD</text>
  </g>
  <g transform="translate(495, 380) rotate(-90)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#6B5244" letter-spacing="1">MARKET STREET</text>
  </g>

  <!-- Metro Station Marker -->
  <g transform="translate(130, 300)">
    <circle cx="0" cy="0" r="15" fill="#3D5A80"/>
    <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">M</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#293241" text-anchor="middle">Central Metro (3 min)</text>
  </g>

  <!-- Bus Stop Marker -->
  <g transform="translate(420, 170)">
    <circle cx="0" cy="0" r="10" fill="#F4A261"/>
    <text x="0" y="3.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BUS</text>
  </g>

  <!-- Pulsing Target Ring at Bakery Location (142 Artisan Boulevard) -->
  <circle cx="240" cy="225" r="45" fill="url(#pinGlow)"/>
  <circle cx="240" cy="225" r="28" fill="#E88D7D" opacity="0.2"/>

  <!-- Bakery Map Pin with High Polish -->
  <g transform="translate(240, 225)" filter="url(#pinShadow)">
    <!-- Location Pin Path -->
    <path d="M0 0 C-18 -22, -26 -40, -26 -55 C-26 -74, -14 -86, 0 -86 C14 -86, 26 -74, 26 -55 C26 -40, 18 -22, 0 0 Z" fill="#E88D7D" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Inner White Circle -->
    <circle cx="0" cy="-55" r="16" fill="#FFFFFF"/>
    <!-- Bakery Croissant icon inside pin -->
    <path d="M-8 -52 C-10 -60, -4 -64, 0 -64 C4 -64, 10 -60, 8 -52 C5 -48, -5 -48, -8 -52 Z" fill="#D97736"/>
    <circle cx="0" cy="-55" r="3" fill="#E88D7D"/>
    <!-- Ground target point -->
    <circle cx="0" cy="0" r="4" fill="#3B1E0E"/>
  </g>

  <!-- Info Callout Card pointing to the pin -->
  <g transform="translate(260, 115)" filter="url(#pinShadow)">
    <rect x="0" y="0" width="220" height="75" rx="8" fill="#3D2314" stroke="#E88D7D" stroke-width="2"/>
    <!-- Triangle pointer -->
    <polygon points="-8,30 2,24 2,36" fill="#3D2314"/>
    <text x="15" y="24" font-family="'Playfair Display', Georgia, serif" font-size="14" font-weight="bold" fill="#FAF5EE">SWEET CRUMB BAKERY</text>
    <text x="15" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#F4A261">142 Artisan Blvd, Suite 4B</text>
    <text x="15" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#EAD5C3">★ 4.9 (480+ Reviews) • Open Today</text>
  </g>

  <!-- Map Compass Rose (Top Right) -->
  <g transform="translate(730, 80)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#DFCFBE" stroke-width="2"/>
    <polygon points="0,-16 4,0 -4,0" fill="#E88D7D"/>
    <polygon points="0,16 4,0 -4,0" fill="#BFAF9E"/>
    <text x="0" y="-18" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="bold" fill="#E88D7D" text-anchor="middle">N</text>
  </g>

  <!-- Scale Indicator (Bottom Right) -->
  <g transform="translate(680, 420)">
    <rect x="-10" y="-14" width="80" height="20" rx="4" fill="#FFFFFF" opacity="0.8"/>
    <line x1="0" y1="-4" x2="60" y2="-4" stroke="#3D2314" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="0" stroke="#3D2314" stroke-width="2"/>
    <line x1="60" y1="-8" x2="60" y2="0" stroke="#3D2314" stroke-width="2"/>
    <text x="30" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#3D2314" text-anchor="middle">200 m</text>
  </g>
</svg>