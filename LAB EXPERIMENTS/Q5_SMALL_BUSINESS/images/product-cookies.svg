<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <radialGradient id="cookieBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="70%" stop-color="#FDF2EA" />
      <stop offset="100%" stop-color="#F9E2D5" />
    </radialGradient>
    <radialGradient id="cookieDough" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FCE1C3" />
      <stop offset="60%" stop-color="#EAA66E" />
      <stop offset="100%" stop-color="#C57538" />
    </radialGradient>
    <linearGradient id="macaronPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCCD5" />
      <stop offset="50%" stop-color="#FB6F92" />
      <stop offset="100%" stop-color="#E0406A" />
    </linearGradient>
    <linearGradient id="macaronPistachio" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" />
      <stop offset="50%" stop-color="#A5D6A7" />
      <stop offset="100%" stop-color="#66BB6A" />
    </linearGradient>
    <filter id="cookieShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5C341D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="url(#cookieBg)"/>

  <!-- Baking Parchment Paper -->
  <g filter="url(#cookieShadow)">
    <path d="M90 140 L510 110 L480 370 L70 360 Z" fill="#FFF8EE" stroke="#EAD4C0" stroke-width="2"/>
    <line x1="85" y1="200" x2="495" y2="185" stroke="#F5E4D2" stroke-width="1.5" stroke-dasharray="8 8"/>
  </g>

  <!-- Crumbled cookie pieces & chocolate drops -->
  <circle cx="130" cy="190" r="4" fill="#3B1E0E"/>
  <circle cx="160" cy="170" r="2.5" fill="#C57538"/>
  <circle cx="440" cy="340" r="3.5" fill="#3B1E0E"/>
  <circle cx="410" cy="355" r="2" fill="#C57538"/>
  <rect x="450" y="160" width="6" height="6" rx="1.5" fill="#3B1E0E" transform="rotate(25 453 163)"/>

  <!-- COOKIE 1: Back Left (Chunky Chocolate Chip) -->
  <g transform="translate(200, 210)" filter="url(#cookieShadow)">
    <circle cx="0" cy="0" r="68" fill="url(#cookieDough)"/>
    <!-- Surface cracks -->
    <path d="M-30 -20 Q -10 -10 0 -25" stroke="#A85720" stroke-width="2.5" fill="none"/>
    <path d="M10 10 Q 30 20 40 -5" stroke="#A85720" stroke-width="2.5" fill="none"/>
    <path d="M-15 25 Q 5 35 15 20" stroke="#A85720" stroke-width="2.5" fill="none"/>
    <!-- Melted Choc Chunks -->
    <rect x="-42" y="-12" width="16" height="14" rx="3" fill="#2E170A"/>
    <rect x="-8" y="-40" width="18" height="16" rx="4" fill="#3B1E0E"/>
    <rect x="18" y="-22" width="15" height="15" rx="3" fill="#2E170A"/>
    <rect x="-24" y="24" width="17" height="14" rx="3.5" fill="#3B1E0E"/>
    <rect x="12" y="18" width="20" height="15" rx="4" fill="#2E170A"/>
    <rect x="-5" y="-5" width="14" height="14" rx="3" fill="#3B1E0E"/>
  </g>

  <!-- COOKIE 2: Front Center (Double Fudge Sea Salt Hero Cookie) -->
  <g transform="translate(320, 265)" filter="url(#cookieShadow)">
    <!-- Cookie Edge with irregular organic outline -->
    <path d="M0 -80 
             C 45 -82, 78 -50, 82 -10 
             C 85 35, 60 78, 15 82 
             C -35 85, -78 55, -82 10 
             C -85 -35, -50 -78, 0 -80 Z" 
          fill="url(#cookieDough)"/>
    
    <!-- Dough fissures -->
    <path d="M-50 -10 Q-20 5 0 -15 Q25 -5 45 -30" stroke="#8C4414" stroke-width="3" fill="none"/>
    <path d="M-30 30 Q0 15 35 35" stroke="#8C4414" stroke-width="3" fill="none"/>

    <!-- Large gooey molten chocolate pools -->
    <path d="M-45 -35 Q-25 -45 -15 -30 Q-25 -10 -45 -20 Z" fill="#220F06"/>
    <path d="M10 -50 Q40 -40 30 -20 Q5 -25 10 -50 Z" fill="#220F06"/>
    <path d="M-15 -5 Q15 -15 25 5 Q-5 15 -15 -5 Z" fill="#2E170A"/>
    <path d="M-50 15 Q-30 0 -20 20 Q-40 35 -50 15 Z" fill="#220F06"/>
    <path d="M15 15 Q45 20 35 45 Q5 40 15 15 Z" fill="#220F06"/>
    
    <!-- Flaky Maldon Sea Salt Crystals -->
    <rect x="-25" y="-30" width="8" height="4" fill="#FFFFFF" opacity="0.9" transform="rotate(20 -21 -28)"/>
    <rect x="15" y="-12" width="7" height="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-35 18 -10)"/>
    <rect x="-10" y="10" width="6" height="4" fill="#FFFFFF" opacity="0.9" transform="rotate(15 -7 12)"/>
    <rect x="25" y="25" width="7" height="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-15 28 27)"/>
  </g>

  <!-- MACARONS: Right side stacked delicately -->
  <!-- Raspberry Macaron -->
  <g transform="translate(450, 230)" filter="url(#cookieShadow)">
    <!-- Bottom Shell -->
    <ellipse cx="0" cy="18" rx="42" ry="14" fill="url(#macaronPink)"/>
    <!-- Feet texture -->
    <ellipse cx="0" cy="10" rx="43" ry="6" fill="#D81B60"/>
    <!-- White Chocolate Ganache filling -->
    <ellipse cx="0" cy="5" rx="39" ry="8" fill="#FFFDF9"/>
    <!-- Top Shell -->
    <ellipse cx="0" cy="-5" rx="42" ry="18" fill="url(#macaronPink)"/>
    <ellipse cx="-10" cy="-12" rx="20" ry="7" fill="#FFAEC0" opacity="0.6"/>
  </g>

  <!-- Pistachio Macaron -->
  <g transform="translate(435, 175) rotate(-12)" filter="url(#cookieShadow)">
    <ellipse cx="0" cy="16" rx="38" ry="12" fill="url(#macaronPistachio)"/>
    <ellipse cx="0" cy="8" rx="39" ry="5" fill="#43A047"/>
    <ellipse cx="0" cy="4" rx="36" ry="7" fill="#FFFDE7"/>
    <ellipse cx="0" cy="-5" rx="38" ry="16" fill="url(#macaronPistachio)"/>
    <ellipse cx="-8" cy="-12" rx="18" ry="6" fill="#C8E6C9" opacity="0.6"/>
  </g>

  <!-- Badge label -->
  <g transform="translate(480, 45)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#F4A261"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">FRESH BATCH</text>
  </g>
</svg>