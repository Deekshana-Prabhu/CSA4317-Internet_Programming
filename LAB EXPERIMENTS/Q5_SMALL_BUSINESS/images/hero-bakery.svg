<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <linearGradient id="bgWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26160F" />
      <stop offset="60%" stop-color="#3D2314" />
      <stop offset="100%" stop-color="#54331C" />
    </linearGradient>
    <radialGradient id="lampGlow1" cx="30%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFECC7" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#F4A261" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#26160F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lampGlow2" cx="70%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FFECC7" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#F4A261" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#26160F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="woodShelf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6F4426" />
      <stop offset="50%" stop-color="#8C5832" />
      <stop offset="100%" stop-color="#5E381E" />
    </linearGradient>
    <linearGradient id="counterMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF4EE" />
      <stop offset="50%" stop-color="#F2E6DA" />
      <stop offset="100%" stop-color="#E5D3C1" />
    </linearGradient>
    <linearGradient id="goldCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9965B" />
      <stop offset="50%" stop-color="#D97736" />
      <stop offset="100%" stop-color="#9E4712" />
    </linearGradient>
    <linearGradient id="cakeChoc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E2A17" />
      <stop offset="100%" stop-color="#2C1509" />
    </linearGradient>
    <linearGradient id="frostingPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE2DC" />
      <stop offset="100%" stop-color="#E88D7D" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F0804" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Bakery Wall Background -->
  <rect width="1400" height="800" fill="url(#bgWall)"/>

  <!-- Brick Texture Subtle Lines -->
  <g stroke="#482A18" stroke-width="1.5" opacity="0.35">
    <line x1="0" y1="80" x2="1400" y2="80"/>
    <line x1="0" y1="140" x2="1400" y2="140"/>
    <line x1="0" y1="200" x2="1400" y2="200"/>
    <line x1="0" y1="260" x2="1400" y2="260"/>
    <line x1="0" y1="320" x2="1400" y2="320"/>
  </g>

  <!-- Hanging Lamps & Atmospheric Glow -->
  <circle cx="380" cy="160" r="320" fill="url(#lampGlow1)"/>
  <circle cx="1020" cy="160" r="320" fill="url(#lampGlow2)"/>

  <!-- Lamp 1 Cord & Fixture -->
  <line x1="380" y1="0" x2="380" y2="120" stroke="#1A0F0A" stroke-width="3"/>
  <path d="M340 120 Q380 90 420 120 Z" fill="#D97736"/>
  <circle cx="380" cy="126" r="14" fill="#FFECC7"/>

  <!-- Lamp 2 Cord & Fixture -->
  <line x1="1020" y1="0" x2="1020" y2="120" stroke="#1A0F0A" stroke-width="3"/>
  <path d="M980 120 Q1020 90 1060 120 Z" fill="#D97736"/>
  <circle cx="1020" cy="126" r="14" fill="#FFECC7"/>

  <!-- Chalkboard Menu on Wall -->
  <rect x="560" y="70" width="280" height="180" rx="8" fill="#1C1B1A" stroke="#7A4B29" stroke-width="7" filter="url(#softShadow)"/>
  <text x="700" y="110" font-family="'Playfair Display', Georgia, serif" font-size="20" fill="#F4A261" text-anchor="middle" font-weight="bold">ARTISAN SPECIALS</text>
  <line x1="610" y1="122" x2="790" y2="122" stroke="#E88D7D" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="600" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#FDF3E7">Sourdough Country Loaf</text>
  <text x="795" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#F4A261" text-anchor="end">$6.50</text>
  <text x="600" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#FDF3E7">Belgian Berry Tart</text>
  <text x="795" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#F4A261" text-anchor="end">$5.25</text>
  <text x="600" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#FDF3E7">Almond Flaky Croissant</text>
  <text x="795" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#F4A261" text-anchor="end">$4.75</text>

  <!-- Wooden Shelves -->
  <!-- Top Shelf Left -->
  <rect x="80" y="240" width="400" height="18" rx="3" fill="url(#woodShelf)" filter="url(#softShadow)"/>
  <!-- Top Shelf Right -->
  <rect x="920" y="240" width="400" height="18" rx="3" fill="url(#woodShelf)" filter="url(#softShadow)"/>

  <!-- Left Shelf Items: Breads in Baskets -->
  <!-- Bread Baskets -->
  <ellipse cx="180" cy="235" rx="50" ry="10" fill="#754728"/>
  <ellipse cx="180" cy="210" rx="36" ry="32" fill="url(#goldCrust)"/>
  <path d="M160 195 Q 180 180 200 195" stroke="#FFE9D1" stroke-width="2.5" fill="none"/>
  
  <ellipse cx="320" cy="235" rx="60" ry="10" fill="#754728"/>
  <!-- Baguettes leaning -->
  <g transform="rotate(-25 310 200)">
    <rect x="290" y="120" width="22" height="110" rx="11" fill="url(#goldCrust)"/>
    <line x1="294" y1="140" x2="308" y2="150" stroke="#FFE9D1" stroke-width="2"/>
    <line x1="294" y1="165" x2="308" y2="175" stroke="#FFE9D1" stroke-width="2"/>
    <line x1="294" y1="190" x2="308" y2="200" stroke="#FFE9D1" stroke-width="2"/>
  </g>
  <g transform="rotate(15 340 200)">
    <rect x="330" y="125" width="22" height="105" rx="11" fill="url(#goldCrust)"/>
    <line x1="334" y1="145" x2="348" y2="155" stroke="#FFE9D1" stroke-width="2"/>
    <line x1="334" y1="170" x2="348" y2="180" stroke="#FFE9D1" stroke-width="2"/>
  </g>

  <!-- Right Shelf Items: Glass Jars of Flour, Croissants & Cookies -->
  <rect x="970" y="175" width="45" height="65" rx="6" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFECC7" stroke-width="2"/>
  <rect x="975" y="195" width="35" height="40" fill="#FAF5EE" opacity="0.8"/>
  <rect x="980" y="168" width="25" height="7" rx="2" fill="#8C5832"/>

  <!-- Croissant Display -->
  <g transform="translate(1080, 215)">
    <path d="M-30 15 C-25 -5, 25 -5, 30 15 C15 18, -15 18, -30 15 Z" fill="url(#goldCrust)"/>
    <path d="M-18 8 Q 0 -2 18 8" stroke="#FFE2B8" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(1220, 215)">
    <path d="M-30 15 C-25 -5, 25 -5, 30 15 C15 18, -15 18, -30 15 Z" fill="url(#goldCrust)"/>
    <path d="M-18 8 Q 0 -2 18 8" stroke="#FFE2B8" stroke-width="2" fill="none"/>
  </g>

  <!-- Lower Shelf Left -->
  <rect x="80" y="380" width="400" height="18" rx="3" fill="url(#woodShelf)" filter="url(#softShadow)"/>
  <!-- Lower Shelf Right -->
  <rect x="920" y="380" width="400" height="18" rx="3" fill="url(#woodShelf)" filter="url(#softShadow)"/>

  <!-- Pastry boxes and pies on lower shelves -->
  <rect x="140" y="325" width="90" height="55" rx="4" fill="#FDECE9" stroke="#E88D7D" stroke-width="2"/>
  <rect x="140" y="345" width="90" height="8" fill="#E88D7D"/>
  <rect x="270" y="335" width="120" height="45" rx="4" fill="#F4A261" opacity="0.9"/>
  <!-- Berry Pie -->
  <ellipse cx="1030" cy="365" rx="45" ry="14" fill="#D97736"/>
  <ellipse cx="1030" cy="358" rx="36" ry="9" fill="#991B1B"/>
  <ellipse cx="1180" cy="365" rx="45" ry="14" fill="#D97736"/>
  <ellipse cx="1180" cy="358" rx="36" ry="9" fill="#F4A261"/>

  <!-- Foreground Main Counter Display -->
  <!-- Marble Counter Top -->
  <path d="M0 520 L1400 520 L1400 800 L0 800 Z" fill="#2E1C12"/>
  <rect x="0" y="490" width="1400" height="35" fill="url(#counterMarble)" filter="url(#softShadow)"/>
  <rect x="0" y="525" width="1400" height="12" fill="#D8C4B0"/>

  <!-- Glass Display Case -->
  <rect x="120" y="440" width="1160" height="140" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFE2B8" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="120" y1="465" x2="1280" y2="465" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Centered Signature 3-Tier Cake inside counter -->
  <g transform="translate(700, 480)">
    <!-- Stand -->
    <ellipse cx="0" cy="12" rx="60" ry="8" fill="#E5D3C1"/>
    <rect x="-12" y="12" width="24" height="18" fill="#C5B19E"/>
    <ellipse cx="0" cy="30" rx="40" ry="6" fill="#B39F8C"/>
    <!-- Bottom Tier -->
    <rect x="-70" y="-35" width="140" height="42" rx="4" fill="url(#cakeChoc)"/>
    <ellipse cx="0" cy="-35" rx="70" ry="12" fill="#4E2A17"/>
    <!-- Frosting drip -->
    <path d="M-70 -35 Q-55 -20 -40 -35 Q-25 -15 -10 -35 Q5 -18 20 -35 Q35 -15 50 -35 Q60 -20 70 -35" fill="#FAF5EE"/>
    <!-- Middle Tier -->
    <rect x="-50" y="-80" width="100" height="45" rx="3" fill="url(#frostingPink)"/>
    <ellipse cx="0" cy="-80" rx="50" ry="10" fill="#FDE2DC"/>
    <!-- Top Tier -->
    <rect x="-30" y="-115" width="60" height="35" rx="3" fill="url(#cakeChoc)"/>
    <ellipse cx="0" cy="-115" rx="30" ry="7" fill="#6A3B21"/>
    <!-- Strawberries & topper -->
    <circle cx="-12" cy="-122" r="7" fill="#E63946"/>
    <circle cx="12" cy="-122" r="7" fill="#E63946"/>
    <circle cx="0" cy="-126" r="8" fill="#C1121F"/>
  </g>

  <!-- Left: Artisan Cupcake Stand -->
  <g transform="translate(360, 475)">
    <!-- Stand -->
    <ellipse cx="0" cy="20" rx="75" ry="10" fill="#E5D3C1"/>
    <!-- Cupcake 1 -->
    <g transform="translate(-45, 0)">
      <path d="M-15 15 L-20 -5 L20 -5 L15 15 Z" fill="#F4A261"/>
      <ellipse cx="0" cy="-8" rx="20" ry="12" fill="#E88D7D"/>
      <circle cx="0" cy="-18" r="5" fill="#E63946"/>
    </g>
    <!-- Cupcake 2 -->
    <g transform="translate(0, -8)">
      <path d="M-15 15 L-20 -5 L20 -5 L15 15 Z" fill="#5E381E"/>
      <ellipse cx="0" cy="-8" rx="20" ry="12" fill="#FAF5EE"/>
      <circle cx="0" cy="-18" r="5" fill="#D97736"/>
    </g>
    <!-- Cupcake 3 -->
    <g transform="translate(45, 0)">
      <path d="M-15 15 L-20 -5 L20 -5 L15 15 Z" fill="#F4A261"/>
      <ellipse cx="0" cy="-8" rx="20" ry="12" fill="#FDE2DC"/>
      <circle cx="0" cy="-18" r="5" fill="#E63946"/>
    </g>
  </g>

  <!-- Right: Bread Loaves & Croissants Platter -->
  <g transform="translate(1040, 470)">
    <ellipse cx="0" cy="25" rx="90" ry="12" fill="#8C5832"/>
    <!-- Sourdough Boule -->
    <ellipse cx="-40" cy="5" rx="42" ry="24" fill="url(#goldCrust)"/>
    <path d="M-60 0 Q-40 -12 -20 0" stroke="#FFE9D1" stroke-width="2.5" fill="none"/>
    <!-- Croissants -->
    <g transform="translate(35, 12)">
      <path d="M-30 8 C-25 -10, 25 -10, 30 8 C15 12, -15 12, -30 8 Z" fill="url(#goldCrust)"/>
      <path d="M-15 0 Q 0 -8 15 0" stroke="#FFE2B8" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Front Counter Wooden Slats and Warm Ambient Light -->
  <g stroke="#3D2314" stroke-width="3" opacity="0.6">
    <line x1="200" y1="535" x2="200" y2="800"/>
    <line x1="400" y1="535" x2="400" y2="800"/>
    <line x1="600" y1="535" x2="600" y2="800"/>
    <line x1="800" y1="535" x2="800" y2="800"/>
    <line x1="1000" y1="535" x2="1000" y2="800"/>
    <line x1="1200" y1="535" x2="1200" y2="800"/>
  </g>

  <!-- Warm Vignette Overlay -->
  <rect width="1400" height="800" fill="url(#lampGlow1)" opacity="0.25"/>
</svg>