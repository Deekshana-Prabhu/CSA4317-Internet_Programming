<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <radialGradient id="ovenGlow" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#FFE0B2" />
      <stop offset="40%" stop-color="#FF9800" />
      <stop offset="70%" stop-color="#BF360C" />
      <stop offset="100%" stop-color="#211008" />
    </radialGradient>
    <linearGradient id="brickWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E2A17" />
      <stop offset="100%" stop-color="#2D150A" />
    </linearGradient>
    <linearGradient id="loafCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4A261" />
      <stop offset="50%" stop-color="#C85A17" />
      <stop offset="100%" stop-color="#6E2C08" />
    </linearGradient>
    <filter id="ovenShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Brick Hearth Wall -->
  <rect width="600" height="420" fill="url(#brickWall)"/>

  <!-- Brick Masonry Details -->
  <g stroke="#3A1C0E" stroke-width="2" opacity="0.6">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <!-- Vertical joints -->
    <line x1="70" y1="0" x2="70" y2="40"/>
    <line x1="190" y1="0" x2="190" y2="40"/>
    <line x1="410" y1="0" x2="410" y2="40"/>
    <line x1="530" y1="0" x2="530" y2="40"/>
    <line x1="130" y1="40" x2="130" y2="80"/>
    <line x1="250" y1="40" x2="250" y2="80"/>
    <line x1="470" y1="40" x2="470" y2="80"/>
  </g>

  <!-- Arched Hearth Stone Oven Opening -->
  <g filter="url(#ovenShadow)">
    <!-- Outer Stone Arch Trim -->
    <path d="M70 380 L70 200 C 70 80, 530 80, 530 200 L530 380 Z" fill="#6A3B1D" stroke="#8C4E26" stroke-width="8"/>
    <!-- Fire Chamber Interior -->
    <path d="M100 370 L100 210 C 100 110, 500 110, 500 210 L500 370 Z" fill="url(#ovenGlow)"/>
    <!-- Refractory Stone Deck Floor -->
    <rect x="90" y="340" width="420" height="40" fill="#3D1D0E"/>
    <line x1="90" y1="340" x2="510" y2="340" stroke="#FFB74D" stroke-width="3"/>
  </g>

  <!-- Loaves baking inside the oven deck -->
  <!-- Loaf 1 (Left Sourdough) -->
  <g transform="translate(190, 310)">
    <ellipse cx="0" cy="15" rx="55" ry="30" fill="url(#loafCrust)"/>
    <path d="M-35 5 Q 0 -10 35 5" stroke="#FFE0B2" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M-20 -5 Q -10 -15 0 -5" stroke="#FFE0B2" stroke-width="3" fill="none"/>
    <path d="M10 -5 Q 20 -15 30 -5" stroke="#FFE0B2" stroke-width="3" fill="none"/>
  </g>

  <!-- Loaf 2 (Center High Loaf) -->
  <g transform="translate(300, 290)">
    <ellipse cx="0" cy="20" rx="65" ry="36" fill="url(#loafCrust)"/>
    <!-- Flour dusting & ear score -->
    <ellipse cx="0" cy="5" rx="50" ry="18" fill="#FFCC80" opacity="0.3"/>
    <path d="M-45 10 Q 0 -14 45 10" stroke="#FFF3E0" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-42 10 Q 0 -12 42 10" stroke="#FFB74D" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Loaf 3 (Right Baguette Ends) -->
  <g transform="translate(415, 315)">
    <ellipse cx="0" cy="12" rx="52" ry="26" fill="url(#loafCrust)"/>
    <line x1="-30" y1="5" x2="-10" y2="15" stroke="#FFE0B2" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="12" y2="10" stroke="#FFE0B2" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="14" y1="-5" x2="34" y2="5" stroke="#FFE0B2" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Baker's Long Wooden Peel entering from bottom left -->
  <g transform="translate(140, 390) rotate(-16)" filter="url(#ovenShadow)">
    <!-- Wooden Peel Blade -->
    <path d="M60 -25 L210 -25 C230 -25, 240 25, 210 25 L60 25 Z" fill="#C58548" stroke="#8C4F1A" stroke-width="2"/>
    <!-- Handle -->
    <rect x="-180" y="-8" width="250" height="16" rx="4" fill="#9C5A23"/>
  </g>

  <!-- Rising Heat Steam Vignette -->
  <path d="M220 220 Q 230 180 225 150 Q 220 120 235 90" stroke="#FFE082" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M300 200 Q 310 160 305 130 Q 300 100 315 70" stroke="#FFE082" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M380 220 Q 370 180 375 150 Q 380 120 370 90" stroke="#FFE082" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
</svg>