<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VELOCITY – Top Frame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #181d24 0%, #11141a 100%);
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 2px solid #e63946;
      overflow: hidden;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }
    .logo-box {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #e63946 0%, #ff6b35 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 0 12px rgba(230, 57, 70, 0.5);
      transform: skewX(-6deg);
    }
    .brand-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .brand-title h1 span {
      color: #ff6b35;
    }
    .brand-title p {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-btn {
      background: #262c36;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      background: #ff6b35;
      color: #fff;
      border-color: #ff6b35;
    }
    .switch-modern-btn {
      background: #e63946;
      border-color: #e63946;
      color: #fff;
      font-weight: 700;
    }
    .switch-modern-btn:hover {
      background: #d62828;
    }
  </style>
</head>
<body>

  <a href="content.html?brand=All" target="mainFrame" class="brand-wrap">
    <div class="logo-box">
      <i class="fa-solid fa-bolt-lightning"></i>
    </div>
    <div class="brand-title">
      <h1>VELOCITY <span>BIKES</span></h1>
      <p>Ride Your Dream. Own Your Journey.</p>
    </div>
  </a>

  <div class="nav-links">
    <a href="content.html?brand=All" target="mainFrame" class="nav-btn">
      <i class="fa-solid fa-motorcycle"></i> All Bikes
    </a>
    <a href="content.html?view=bookings" target="mainFrame" class="nav-btn">
      <i class="fa-solid fa-receipt"></i> Bookings & Receipts
    </a>
    <a href="content.html?view=showroom" target="mainFrame" class="nav-btn">
      <i class="fa-solid fa-location-dot"></i> Showroom Info
    </a>
    <a href="content.html?view=admin" target="mainFrame" class="nav-btn">
      <i class="fa-solid fa-lock"></i> Admin
    </a>
    <a href="index.html" target="_top" class="nav-btn switch-modern-btn" title="Open modern single-page 3-frame layout">
      <i class="fa-solid fa-arrow-up-right-from-square"></i> Modern View
    </a>
  </div>

</body>
</html>
