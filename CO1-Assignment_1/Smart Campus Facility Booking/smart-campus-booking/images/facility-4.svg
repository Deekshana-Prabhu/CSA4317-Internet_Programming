<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101f" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Room Interior Canvas -->
  <rect width="800" height="500" fill="url(#wallGrad)" />

  <!-- Architectural Room Lines (Perspective Wall & Ceiling) -->
  <polygon points="0,0 800,0 680,120 120,120" fill="#131e33" opacity="0.8" />
  <polygon points="0,0 120,120 120,380 0,500" fill="#0d1527" opacity="0.9" />
  <polygon points="800,0 800,500 680,380 680,120" fill="#111c30" opacity="0.9" />
  <!-- Floor with subtle perspective grid lines -->
  <polygon points="120,380 680,380 800,500 0,500" fill="url(#floorGrad)" />
  <line x1="260" y1="380" x2="200" y2="500" stroke="#334155" stroke-width="1" opacity="0.4" />
  <line x1="400" y1="380" x2="400" y2="500" stroke="#334155" stroke-width="1" opacity="0.4" />
  <line x1="540" y1="380" x2="600" y2="500" stroke="#334155" stroke-width="1" opacity="0.4" />

  <!-- Ceiling Linear Recessed LED Lights -->
  <line x1="180" y1="60" x2="620" y2="60" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#softGlow)" />
  <line x1="220" y1="90" x2="580" y2="90" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#softGlow)" />

  <!-- Center Stage / Large Interactive Video Display / Wall -->
  <g transform="translate(180, 140)" filter="url(#dropShadow)">
    <rect width="440" height="200" rx="14" fill="#0b1329" stroke="#38bdf8" stroke-width="2.5" />
    <rect x="12" y="12" width="416" height="176" rx="8" fill="url(#screenGlow)" opacity="0.15" />
    <!-- Ambient digital graphic inside screen -->
    <circle cx="220" cy="100" r="60" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />
    <circle cx="220" cy="100" r="35" fill="none" stroke="#0d9488" stroke-width="2.5" opacity="0.8" />
    
    <!-- Large Center Icon Representation -->
    <g transform="translate(195, 75)">
      
  <circle cx="25" cy="22" r="10" fill="none" stroke="#f8fafc" stroke-width="2.5" />
  <circle cx="12" cy="12" r="3" fill="#38bdf8" />
  <circle cx="38" cy="12" r="3" fill="#38bdf8" />
  <circle cx="12" cy="34" r="3" fill="#2dd4bf" />
  <circle cx="38" cy="34" r="3" fill="#2dd4bf" />
  <line x1="14" y1="14" x2="20" y2="18" stroke="#38bdf8" stroke-width="1.8" />
  <line x1="36" y1="14" x2="30" y2="18" stroke="#38bdf8" stroke-width="1.8" />
  <line x1="14" y1="32" x2="20" y2="26" stroke="#2dd4bf" stroke-width="1.8" />
  <line x1="36" y1="32" x2="30" y2="26" stroke="#2dd4bf" stroke-width="1.8" />

    </g>

    <!-- Display Text Overlay -->
    <text x="220" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="18" fill="#f8fafc" text-anchor="middle" letter-spacing="1">AI & ML LABORATORY</text>
    <text x="220" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#94a3b8" text-anchor="middle">Turing IT Center • 45 GPU Workstations • High-Performance Compute</text>
  </g>

  <!-- Foreground Furniture / Features (Auditorium Rows, Desks, Podiums) -->
  
  <!-- Workstation Rows with glowing monitors -->
  <g>
    <!-- Left Row -->
    <rect x="140" y="390" width="220" height="25" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="170" y="372" width="30" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="235" y="372" width="30" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="300" y="372" width="30" height="18" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Right Row -->
    <rect x="440" y="390" width="220" height="25" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <rect x="470" y="372" width="30" height="18" rx="2" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
    <rect x="535" y="372" width="30" height="18" rx="2" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
    <rect x="600" y="372" width="30" height="18" rx="2" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" />
  </g>


  <!-- Modern Glass Watermark / Info Badge -->
  <g transform="translate(30, 30)">
    <rect width="180" height="42" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" />
    <circle cx="22" cy="21" r="6" fill="#0d9488" />
    <text x="36" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#f8fafc">SMART FACILITY</text>
  </g>
</svg>