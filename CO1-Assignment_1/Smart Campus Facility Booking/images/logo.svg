<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Shield -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Smart Hub Nodes & Academic Cap -->
    <path d="M 30 18 L 48 27 L 30 36 L 12 27 Z" fill="url(#logoGrad)" />
    <path d="M 44 30 L 44 42 C 44 46, 16 46, 16 42 L 16 30" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="30" cy="46" r="3" fill="#2dd4bf" filter="url(#glow)" />
    <line x1="30" y1="36" x2="30" y2="43" stroke="#2dd4bf" stroke-width="2" />
    <circle cx="20" cy="38" r="2" fill="#38bdf8" />
    <circle cx="40" cy="38" r="2" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <text x="82" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="22" fill="#0f172a" letter-spacing="-0.5">SMART<tspan fill="#0d9488">CAMPUS</tspan></text>
  <text x="82" y="55" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="10.5" fill="#64748b" letter-spacing="2.2">FACILITY BOOKING SYSTEM</text>
</svg>