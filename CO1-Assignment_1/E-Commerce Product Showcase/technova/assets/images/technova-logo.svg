<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g transform="translate(10, 8)">
    <!-- Circuit / Cube Icon -->
    <rect x="2" y="2" width="40" height="40" rx="10" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="2.5"/>
    <path d="M12 22 L22 12 L32 22 L22 32 Z" fill="none" stroke="#00d2ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="22" cy="22" r="4" fill="#00f5d4"/>
    <line x1="22" y1="12" x2="22" y2="6" stroke="#00d2ff" stroke-width="2"/>
    <line x1="22" y1="32" x2="22" y2="38" stroke="#00d2ff" stroke-width="2"/>
    <line x1="12" y1="22" x2="6" y2="22" stroke="#00d2ff" stroke-width="2"/>
    <line x1="32" y1="22" x2="38" y2="22" stroke="#00d2ff" stroke-width="2"/>
    
    <!-- Text -->
    <text x="56" y="27" font-family="'Montserrat', 'Poppins', 'Segoe UI', sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1.5">TECH<tspan fill="#00d2ff">NOVA</tspan></text>
    <text x="58" y="39" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="3.5">ELECTRONICS STORE</text>
  </g>
</svg>