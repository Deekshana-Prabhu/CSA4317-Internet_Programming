<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="400" cy="300" r="280" fill="url(#bgGlow)"/>

  <!-- Tech Geometric Grid Elements -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5">
    <circle cx="400" cy="300" r="240" stroke-dasharray="8 8" fill="none"/>
    <circle cx="400" cy="300" r="160" stroke-dasharray="4 6" fill="none"/>
  </g>

  <!-- Laptop (Backbone) -->
  <g transform="translate(180, 160)" filter="url(#shadow3d)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="440" height="280" rx="16" fill="url(#laptopGrad)" stroke="#475569" stroke-width="2"/>
    <!-- Screen Display -->
    <rect x="15" y="15" width="410" height="250" rx="8" fill="url(#screenGrad)"/>
    <!-- Laptop Camera -->
    <circle cx="220" cy="8" r="3" fill="#0f172a"/>
    <circle cx="220" cy="8" r="1" fill="#38bdf8"/>
    <!-- Screen Content Mockup -->
    <g opacity="0.85">
      <rect x="35" y="35" width="80" height="15" rx="4" fill="#38bdf8"/>
      <rect x="35" y="60" width="160" height="8" rx="3" fill="#94a3b8"/>
      <rect x="35" y="75" width="120" height="8" rx="3" fill="#64748b"/>
      <!-- Wave graphic -->
      <path d="M40 210 Q 120 120, 200 170 T 360 140 T 400 190" fill="none" stroke="#00f5d4" stroke-width="3"/>
      <circle cx="200" cy="170" r="6" fill="#00d2ff"/>
      <circle cx="360" cy="140" r="6" fill="#00f5d4"/>
    </g>
    <!-- Laptop Base -->
    <path d="M-40 280 L480 280 L450 300 L-10 300 Z" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <!-- Trackpad notch -->
    <rect x="180" y="282" width="80" height="5" rx="2" fill="#1e293b"/>
  </g>

  <!-- Smartphone (Front Right) -->
  <g transform="translate(520, 240) rotate(-10)" filter="url(#shadow3d)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="140" height="270" rx="24" fill="#0f172a" stroke="#00d2ff" stroke-width="3"/>
    <!-- Display -->
    <rect x="8" y="8" width="124" height="254" rx="18" fill="url(#phoneGrad)"/>
    <!-- Dynamic Island -->
    <rect x="42" y="14" width="56" height="14" rx="7" fill="#000000"/>
    <!-- App UI Mockup -->
    <circle cx="70" cy="80" r="30" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="120 40"/>
    <text x="70" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">5G</text>
    <rect x="25" y="140" width="90" height="12" rx="4" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="25" y="160" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- Smart Watch (Front Left) -->
  <g transform="translate(100, 290) rotate(12)" filter="url(#shadow3d)">
    <!-- Watch Straps -->
    <path d="M25 -40 L75 -40 L70 20 L30 20 Z" fill="#1e293b"/>
    <path d="M30 110 L70 110 L75 170 L25 170 Z" fill="#1e293b"/>
    <!-- Watch Body -->
    <rect x="10" y="15" width="80" height="100" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="50" cy="65" r="35" fill="#0284c7" fill-opacity="0.3"/>
    <!-- Watch Face -->
    <text x="50" y="60" font-family="sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">10:42</text>
    <text x="50" y="78" font-family="sans-serif" font-size="9" font-weight="bold" fill="#00f5d4" text-anchor="middle">♥ 74 BPM</text>
  </g>

  <!-- Headphones (Top Center-Right) -->
  <g transform="translate(370, 70) scale(0.9)" filter="url(#shadow3d)">
    <!-- Headband -->
    <path d="M 50 140 A 100 100 0 0 1 230 140" fill="none" stroke="#334155" stroke-width="18" stroke-linecap="round"/>
    <path d="M 65 110 A 85 85 0 0 1 215 110" fill="none" stroke="#00d2ff" stroke-width="4"/>
    <!-- Left Ear Cup -->
    <g transform="translate(30, 110)">
      <rect x="0" y="0" width="35" height="75" rx="17" fill="#0f172a" stroke="#00d2ff" stroke-width="2"/>
      <rect x="25" y="8" width="12" height="58" rx="6" fill="#1e293b"/>
    </g>
    <!-- Right Ear Cup -->
    <g transform="translate(215, 110)">
      <rect x="0" y="0" width="35" height="75" rx="17" fill="#0f172a" stroke="#00d2ff" stroke-width="2"/>
      <rect x="-2" y="8" width="12" height="58" rx="6" fill="#1e293b"/>
    </g>
  </g>

  <!-- Floating Badge: Up to 30% OFF -->
  <g transform="translate(620, 140)" filter="url(#shadow3d)">
    <rect x="0" y="0" width="150" height="55" rx="14" fill="#0f172a" stroke="#00f5d4" stroke-width="2"/>
    <text x="75" y="24" font-family="sans-serif" font-weight="bold" font-size="12" fill="#00f5d4" text-anchor="middle">SPECIAL OFFER</text>
    <text x="75" y="44" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">UP TO 30% OFF</text>
  </g>
</svg>