<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon Tech Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon -->
    <polygon points="30,5 55,19 55,47 30,61 5,47 5,19" fill="none" stroke="url(#logoGrad)" stroke-width="2.5" filter="url(#glow)" />
    <!-- Inner Circuit Nodes -->
    <circle cx="30" cy="33" r="7" fill="#00f0ff" opacity="0.9" filter="url(#glow)" />
    <path d="M30,12 L30,26 M30,40 L30,54 M12,23 L24,30 M36,36 L48,43 M12,43 L24,36 M36,30 L48,23" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
    <circle cx="12" cy="23" r="2.5" fill="#ec4899" />
    <circle cx="48" cy="23" r="2.5" fill="#00f0ff" />
    <circle cx="12" cy="43" r="2.5" fill="#8b5cf6" />
    <circle cx="48" cy="43" r="2.5" fill="#ec4899" />
  </g>

  <!-- Typography -->
  <text x="80" y="44" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="28" font-weight="900" letter-spacing="3" fill="#ffffff">
    TECHNO<tspan fill="url(#neonGlow)">VATE</tspan>
  </text>
  <text x="82" y="62" font-family="'Orbitron', 'Segoe UI', monospace" font-size="11" font-weight="700" letter-spacing="5" fill="#00f0ff" opacity="0.9">
    2026 • SYMPOSIUM
  </text>
</svg>
