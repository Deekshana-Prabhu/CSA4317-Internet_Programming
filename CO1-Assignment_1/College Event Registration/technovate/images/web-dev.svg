  <rect x="47" y="105" width="50" height="38" rx="4" fill="rgba(139, 92, 246, 0.25)" stroke="#8b5cf6" stroke-width="1"/>
  <rect x="103" y="105" width="50" height="38" rx="4" fill="rgba(0, 240, 255, 0.25)" stroke="#00f0ff" stroke-width="1"/>
