<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0" />
    </radialGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="300" cy="250" r="180" fill="url(#coreGlow)" />

  <!-- Isometric Base Grid -->
  <g stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.2">
    <path d="M100 250 L300 350 L500 250 L300 150 Z" fill="rgba(15, 23, 42, 0.6)" />
    <path d="M140 250 L300 330 L460 250 L300 170 Z" fill="none" />
    <path d="M180 250 L300 310 L420 250 L300 190 Z" fill="none" />
    <line x1="220" y1="190" x2="380" y2="310" />
    <line x1="380" y1="190" x2="220" y2="310" />
  </g>

  <!-- Vertical Neon Data Pillars -->
  <g stroke="url(#neonCyan)" stroke-width="2" opacity="0.85">
    <line x1="150" y1="260" x2="150" y2="170" stroke-dasharray="4 4" />
    <circle cx="150" cy="165" r="4" fill="#00f0ff" filter="url(#neonBlur)" />
    
    <line x1="450" y1="260" x2="450" y2="160" stroke-dasharray="4 4" />
    <circle cx="450" cy="155" r="4" fill="#00f0ff" filter="url(#neonBlur)" />

    <line x1="300" y1="350" x2="300" y2="390" />
    <circle cx="300" cy="395" r="5" fill="#a855f7" />
  </g>

  <!-- Orbiting Tech Rings -->
  <ellipse cx="300" cy="230" rx="190" ry="75" fill="none" stroke="url(#neonPurple)" stroke-width="2.5" transform="rotate(-15 300 230)" opacity="0.75" />
  <ellipse cx="300" cy="230" rx="160" ry="60" fill="none" stroke="url(#neonCyan)" stroke-width="2" transform="rotate(20 300 230)" filter="url(#neonBlur)" />

  <!-- Core Futuristic Quantum Cube / Hologram Sphere -->
  <g transform="translate(300, 220)">
    <!-- Hexagonal Core -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="rgba(11, 20, 38, 0.85)" stroke="url(#neonCyan)" stroke-width="3" filter="url(#neonBlur)" />
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="none" stroke="url(#neonPurple)" stroke-width="1.8" />
    <!-- Inner glowing node -->
    <circle cx="0" cy="0" r="18" fill="#00f0ff" filter="url(#neonBlur)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Floating Holographic Data Cards -->
  <!-- Card 1: AI / Quantum -->
  <g transform="translate(80, 110)">
    <rect width="130" height="60" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="25" cy="30" r="12" fill="rgba(0, 240, 255, 0.2)" />
    <text x="25" y="34" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00f0ff" text-anchor="middle">⚡</text>
    <text x="45" y="27" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">TECHNOVATE</text>
    <text x="45" y="44" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Symposium '26</text>
  </g>

  <!-- Card 2: Prize Pool -->
  <g transform="translate(390, 80)">
    <rect width="140" height="65" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="25" cy="32" r="12" fill="rgba(168, 85, 247, 0.2)" />
    <text x="25" y="37" font-family="'Segoe UI', sans-serif" font-size="14" fill="#a855f7" text-anchor="middle">🏆</text>
    <text x="45" y="28" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">PRIZE POOL</text>
    <text x="45" y="47" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold" fill="#00f0ff">₹1,50,000+</text>
  </g>

  <!-- Card 3: Live Registration -->
  <g transform="translate(370, 340)">
    <rect width="150" height="55" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="20" cy="28" r="5" fill="#10b981" />
    <text x="35" y="25" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">STATUS: OPEN</text>
    <text x="35" y="42" font-family="'Segoe UI', sans-serif" font-size="10" fill="#38bdf8">500+ Registered</text>
  </g>

  <!-- Floating Sparkles / Particles -->
  <circle cx="220" cy="110" r="3" fill="#00f0ff" opacity="0.9" />
  <circle cx="340" cy="90" r="2.5" fill="#a855f7" opacity="0.8" />
  <circle cx="480" cy="220" r="3" fill="#ec4899" opacity="0.9" />
  <circle cx="120" cy="320" r="2" fill="#00f0ff" opacity="0.7" />
  <circle cx="270" cy="410" r="2.5" fill="#38bdf8" opacity="0.8" />
</svg>
