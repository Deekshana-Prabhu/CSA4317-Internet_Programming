<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="memeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="memeGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#0f172a" fill-opacity="0.8"/>
  <!-- Meme Face Base -->
  <circle cx="100" cy="100" r="54" fill="#1e293b" stroke="url(#memeGrad)" stroke-width="2.5" />
  <!-- Pixelated Thug Sunglasses / Meme Shades -->
  <polygon points="62,82 92,82 88,100 66,100" fill="#000000" stroke="#00f0ff" stroke-width="1.5" />
  <polygon points="108,82 138,82 134,100 112,100" fill="#000000" stroke="#00f0ff" stroke-width="1.5" />
  <rect x="92" y="86" width="16" height="4" fill="#00f0ff" />
  <!-- Glare reflections on shades -->
  <polygon points="66,85 75,85 70,95 65,95" fill="#ffffff" opacity="0.8" />
  <polygon points="112,85 121,85 116,95 111,95" fill="#ffffff" opacity="0.8" />
  <!-- Smirk / Laugh Smile -->
  <path d="M78 122 C88 138, 112 138, 122 122" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" filter="url(#memeGlow)" />
  <!-- Sparkles -->
  <polygon points="152,55 155,62 162,65 155,68 152,75 149,68 142,65 149,62" fill="#f59e0b" filter="url(#memeGlow)" />
</svg>
