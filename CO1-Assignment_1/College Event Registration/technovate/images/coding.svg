<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="codeGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#0f172a" fill-opacity="0.8"/>
  <!-- Terminal window -->
  <rect x="35" y="45" width="130" height="110" rx="12" fill="#090d16" stroke="url(#codeGrad)" stroke-width="2.5" />
  <!-- Terminal Top bar -->
  <rect x="35" y="45" width="130" height="24" rx="12" fill="#1e293b" />
  <circle cx="50" cy="57" r="4" fill="#ef4444" />
  <circle cx="62" cy="57" r="4" fill="#f59e0b" />
  <circle cx="74" cy="57" r="4" fill="#10b981" />
  <!-- Code brackets / prompt -->
  <text x="50" y="95" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00f0ff" filter="url(#codeGlow)">&gt;_</text>
  <text x="80" y="95" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#10b981">solve();</text>
  <text x="50" y="125" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#a855f7">{ }</text>
  <line x1="88" y1="120" x2="140" y2="120" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="3 3" />
</svg>
