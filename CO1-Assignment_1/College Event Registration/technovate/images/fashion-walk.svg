<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="fwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="fwGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#0f172a" fill-opacity="0.8"/>
  <!-- Fashion Runway Perspective -->
  <polygon points="80,150 120,150 110,95 90,95" fill="rgba(236,72,153,0.2)" stroke="url(#fwGrad)" stroke-width="1.5" />
  <!-- Spotlight Beams -->
  <polygon points="40,30 85,150 70,150" fill="url(#fwGrad)" opacity="0.15" />
  <polygon points="160,30 130,150 115,150" fill="url(#fwGrad)" opacity="0.15" />
  <!-- Haute Couture Crown / Tiara -->
  <polygon points="75,85 85,60 100,75 115,60 125,85" fill="#1e293b" stroke="url(#fwGrad)" stroke-width="2.5" />
  <circle cx="85" cy="57" r="3.5" fill="#ec4899" filter="url(#fwGlow)" />
  <circle cx="100" cy="72" r="3.5" fill="#f59e0b" filter="url(#fwGlow)" />
  <circle cx="115" cy="57" r="3.5" fill="#ec4899" filter="url(#fwGlow)" />
  <!-- Gem on crown center -->
  <polygon points="100,80 105,85 100,90 95,85" fill="#00f0ff" filter="url(#fwGlow)" />
  <!-- Runway Lights -->
  <circle cx="68" cy="145" r="3" fill="#f59e0b" />
  <circle cx="132" cy="145" r="3" fill="#f59e0b" />
</svg>
