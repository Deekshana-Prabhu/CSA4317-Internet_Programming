<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="thGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="thGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#0f172a" fill-opacity="0.8"/>
  <!-- Compass Circle -->
  <circle cx="100" cy="100" r="54" fill="#111827" stroke="url(#thGrad)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="46" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 4" />
  <!-- Compass Needle / Star -->
  <polygon points="100,55 107,95 100,90 93,95" fill="#ec4899" filter="url(#thGlow)" />
  <polygon points="100,145 107,105 100,110 93,105" fill="#38bdf8" />
  <polygon points="55,100 95,93 90,100 95,107" fill="#8b5cf6" />
  <polygon points="145,100 105,93 110,100 105,107" fill="#f59e0b" />
  <!-- Center Pivot -->
  <circle cx="100" cy="100" r="6" fill="#f59e0b" filter="url(#thGlow)" />
  <!-- Map path dots -->
  <circle cx="45" cy="45" r="3" fill="#f59e0b" />
  <circle cx="55" cy="38" r="3" fill="#f59e0b" />
  <circle cx="155" cy="155" r="4" fill="#ec4899" filter="url(#thGlow)" />
  <text x="155" y="160" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#ec4899" text-anchor="middle">✕</text>
</svg>
