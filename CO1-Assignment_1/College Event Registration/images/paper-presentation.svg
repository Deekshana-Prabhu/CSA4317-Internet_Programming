<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="ppGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#0f172a" fill-opacity="0.8"/>
  <!-- Paper Base -->
  <path d="M55 40 L125 40 L150 65 L150 160 L55 160 Z" fill="#1e293b" stroke="url(#ppGrad)" stroke-width="2.5" />
  <path d="M125 40 L125 65 L150 65" fill="#334155" stroke="url(#ppGrad)" stroke-width="2" />
  <!-- Circuit Research Lines -->
  <line x1="75" y1="80" x2="130" y2="80" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" filter="url(#ppGlow)" />
  <line x1="75" y1="100" x2="115" y2="100" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="75" y1="120" x2="135" y2="120" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <!-- Microchip Neural Node -->
  <circle cx="105" cy="140" r="8" fill="#8b5cf6" filter="url(#ppGlow)"/>
  <circle cx="105" cy="140" r="3" fill="#ffffff" />
  <line x1="85" y1="140" x2="97" y2="140" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="113" y1="140" x2="125" y2="140" stroke="#8b5cf6" stroke-width="2"/>
</svg>
