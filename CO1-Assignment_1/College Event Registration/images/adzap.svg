<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="adGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="adGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#0f172a" fill-opacity="0.8"/>
  <!-- Megaphone Body -->
  <polygon points="65,90 120,65 120,135 65,110" fill="#1e293b" stroke="url(#adGrad)" stroke-width="2.5" />
  <rect x="45" y="88" width="20" height="24" rx="4" fill="#f59e0b" />
  <path d="M75 110 L82 145 L94 142 L88 110" fill="#334155" stroke="url(#adGrad)" stroke-width="2" />
  <!-- Sound Waves / Lightning Sparks -->
  <path d="M135 78 C145 88, 145 112, 135 122" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" filter="url(#adGlow)" />
  <path d="M148 68 C164 84, 164 116, 148 132" fill="none" stroke="#ec4899" stroke-width="3" stroke-linecap="round" filter="url(#adGlow)" />
  <polygon points="135,100 155,90 148,102 165,102 138,122 144,108" fill="#00f0ff" filter="url(#adGlow)" />
</svg>
