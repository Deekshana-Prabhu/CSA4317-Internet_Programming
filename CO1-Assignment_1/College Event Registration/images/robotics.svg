<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="roboGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="roboGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#0f172a" fill-opacity="0.8"/>
  <!-- Robot Head Outline -->
  <rect x="50" y="55" width="100" height="90" rx="20" fill="#111827" stroke="url(#roboGrad)" stroke-width="2.5" />
  <!-- Antenna -->
  <line x1="100" y1="55" x2="100" y2="35" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <circle cx="100" cy="32" r="5" fill="#ec4899" filter="url(#roboGlow)" />
  <!-- Cyber Visor / Eyes -->
  <rect x="62" y="80" width="76" height="22" rx="10" fill="#000000" stroke="#00f0ff" stroke-width="1.5" />
  <circle cx="82" cy="91" r="6" fill="#00f0ff" filter="url(#roboGlow)" />
  <circle cx="118" cy="91" r="6" fill="#00f0ff" filter="url(#roboGlow)" />
  <!-- Sensor Mouth / Grid -->
  <line x1="75" y1="122" x2="125" y2="122" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <line x1="82" y1="130" x2="118" y2="130" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
  <!-- Ear Nodes -->
  <rect x="42" y="80" width="8" height="25" rx="3" fill="#3b82f6" />
  <rect x="150" y="80" width="8" height="25" rx="3" fill="#3b82f6" />
</svg>
