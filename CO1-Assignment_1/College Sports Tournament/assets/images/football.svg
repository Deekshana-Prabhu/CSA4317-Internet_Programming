<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="60%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020814" />
    </linearGradient>
    <radialGradient id="footGlow" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#footBg)" />
  <rect width="600" height="400" fill="url(#footGlow)" />
  <!-- Goal Net Grid Background -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.15">
    <line x1="280" y1="60" x2="600" y2="60" />
    <line x1="280" y1="120" x2="600" y2="120" />
    <line x1="280" y1="180" x2="600" y2="180" />
    <line x1="280" y1="240" x2="600" y2="240" />
    <line x1="330" y1="40" x2="330" y2="260" />
    <line x1="400" y1="40" x2="400" y2="260" />
    <line x1="470" y1="40" x2="470" y2="260" />
    <line x1="540" y1="40" x2="540" y2="260" />
  </g>
  <!-- Field Goal Post Bars -->
  <line x1="270" y1="40" x2="600" y2="40" stroke="#ffffff" stroke-width="6" opacity="0.8" />
  <line x1="270" y1="40" x2="270" y2="340" stroke="#ffffff" stroke-width="6" opacity="0.8" />
  <!-- Striker Silhouette kicking ball -->
  <g fill="#22c55e" transform="translate(100, 100) scale(1.2)">
    <circle cx="60" cy="20" r="12" />
    <path d="M 60 32 L 68 70 L 50 110 L 40 145" stroke="#22c55e" stroke-width="11" stroke-linecap="round" fill="none" />
    <path d="M 68 70 L 105 85 L 140 75" stroke="#22c55e" stroke-width="11" stroke-linecap="round" fill="none" />
    <path d="M 62 45 L 35 65 L 15 55" stroke="#22c55e" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 62 45 L 95 38 L 120 52" stroke="#22c55e" stroke-width="9" stroke-linecap="round" fill="none" />
  </g>
  <!-- Classical Soccer Ball in Motion -->
  <g transform="translate(320, 160)">
    <circle cx="35" cy="35" r="34" fill="#ffffff" stroke="#111827" stroke-width="3" />
    <!-- Classic Pentagons -->
    <polygon points="35,20 47,28 42,42 28,42 23,28" fill="#111827" />
    <polygon points="35,3 41,12 29,12" fill="#111827" />
    <polygon points="12,26 21,30 18,40 8,36" fill="#111827" />
    <polygon points="58,26 49,30 52,40 62,36" fill="#111827" />
    <polygon points="26,58 35,49 44,58 40,67 30,67" fill="#111827" />
  </g>
  <!-- Speed Lines -->
  <path d="M 270 200 L 310 195 M 250 215 L 300 210" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <rect x="30" y="32" width="130" height="34" rx="17" fill="#15803d" fill-opacity="0.3" stroke="#22c55e" stroke-width="1.5" />
  <text x="95" y="54" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">FOOTBALL</text>
</svg>