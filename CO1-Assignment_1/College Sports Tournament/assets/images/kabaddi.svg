<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="kabBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="kabGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#kabBg)" />
  <rect width="600" height="400" fill="url(#kabGlow)" />
  <!-- Kabaddi Mat Lines -->
  <polygon points="60,350 160,220 440,220 540,350" fill="#78350f" fill-opacity="0.25" stroke="#f59e0b" stroke-width="2"/>
  <!-- Baulk Line & Mid Line -->
  <line x1="160" y1="220" x2="440" y2="220" stroke="#f59e0b" stroke-width="4" />
  <line x1="110" y1="285" x2="490" y2="285" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <!-- Raider silhouette diving (Left to Right) -->
  <g fill="#f97316" transform="translate(140, 110) scale(1.15)">
    <circle cx="85" cy="40" r="12" />
    <path d="M 85 52 L 105 85 L 140 100 L 175 105" stroke="#f97316" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 105 85 L 80 115 L 50 130" stroke="#f97316" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 90 60 L 130 50 L 165 40" stroke="#f97316" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 90 60 L 60 70 L 40 85" stroke="#f97316" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Defender / Corner Chain (Right) -->
  <g fill="#38bdf8" transform="translate(360, 120) scale(1.1)">
    <!-- Defender 1 -->
    <circle cx="40" cy="35" r="11" />
    <path d="M 40 47 L 35 90 L 15 130" stroke="#38bdf8" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 35 90 L 55 125" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 40 60 L 10 75" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 40 60 L 75 70" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Defender 2 holding hands -->
    <circle cx="85" cy="40" r="11" />
    <path d="M 85 52 L 80 95 L 95 135" stroke="#38bdf8" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 80 95 L 65 130" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 85 65 L 75 70" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Speed Impact Marks -->
  <circle cx="340" cy="180" r="28" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="8,6" opacity="0.8"/>
  <rect x="30" y="32" width="130" height="34" rx="17" fill="#ea580c" fill-opacity="0.3" stroke="#f97316" stroke-width="1.5" />
  <text x="95" y="54" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">KABADDI</text>
</svg>