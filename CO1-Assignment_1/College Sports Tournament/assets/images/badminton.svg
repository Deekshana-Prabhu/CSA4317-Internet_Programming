<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="badmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <radialGradient id="badmGlow" cx="60%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#badmBg)" />
  <rect width="600" height="400" fill="url(#badmGlow)" />
  <!-- Court perspective lines -->
  <polygon points="120,400 240,260 360,260 480,400" fill="#1e1b4b" opacity="0.4" />
  <line x1="240" y1="260" x2="360" y2="260" stroke="#a855f7" stroke-width="2" />
  <line x1="120" y1="400" x2="480" y2="400" stroke="#a855f7" stroke-width="3" />
  <!-- Badminton Racket -->
  <g transform="translate(180, 100) rotate(-25)">
    <ellipse cx="60" cy="50" rx="35" ry="48" fill="none" stroke="#e879f9" stroke-width="4"/>
    <!-- String Grid -->
    <path d="M 35 50 L 85 50 M 40 30 L 80 30 M 40 70 L 80 70 M 60 10 L 60 90 M 48 15 L 48 85 M 72 15 L 72 85" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    <!-- Shaft & Grip -->
    <line x1="60" y1="98" x2="60" y2="180" stroke="#d946ef" stroke-width="5" stroke-linecap="round"/>
    <rect x="56" y="180" width="8" height="50" rx="3" fill="#f43f5e" />
  </g>
  <!-- Feather Shuttlecock in Motion -->
  <g transform="translate(370, 90) rotate(35)">
    <!-- Feathers -->
    <polygon points="40,20 15,70 65,70" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="40" y1="20" x2="25" y2="70" stroke="#94a3b8" stroke-width="1"/>
    <line x1="40" y1="20" x2="40" y2="70" stroke="#94a3b8" stroke-width="1"/>
    <line x1="40" y1="20" x2="55" y2="70" stroke="#94a3b8" stroke-width="1"/>
    <!-- Cork Base -->
    <ellipse cx="40" cy="18" rx="10" ry="7" fill="#f43f5e" />
  </g>
  <!-- Motion Swoosh -->
  <path d="M 280 220 Q 360 210 390 140" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="6,4" opacity="0.8"/>
  <rect x="30" y="32" width="145" height="34" rx="17" fill="#7e22ce" fill-opacity="0.3" stroke="#c084fc" stroke-width="1.5" />
  <text x="102" y="54" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">BADMINTON</text>
</svg>