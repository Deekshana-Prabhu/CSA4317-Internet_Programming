<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="athBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="athGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#athBg)" />
  <rect width="600" height="400" fill="url(#athGlow)" />
  <!-- Synthetic Running Track Perspective -->
  <polygon points="0,400 160,240 440,240 600,400" fill="#991b1b" fill-opacity="0.5" />
  <!-- White Track Lanes -->
  <line x1="160" y1="240" x2="0" y2="400" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
  <line x1="230" y1="240" x2="150" y2="400" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
  <line x1="300" y1="240" x2="300" y2="400" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
  <line x1="370" y1="240" x2="450" y2="400" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
  <line x1="440" y1="240" x2="600" y2="400" stroke="#ffffff" stroke-width="2.5" opacity="0.6"/>
  <!-- Finish Line Ribbon -->
  <path d="M 60 290 Q 300 320 540 280" fill="none" stroke="#facc15" stroke-width="5" opacity="0.9"/>
  <!-- Sprinter crossing finish line with hands raised in victory -->
  <g fill="#fb7185" transform="translate(240, 90) scale(1.2)">
    <circle cx="50" cy="25" r="12" />
    <path d="M 50 37 L 50 85 L 35 125 L 20 155" stroke="#fb7185" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 50 85 L 75 115 L 105 145" stroke="#fb7185" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- Hands raised in victory -->
    <path d="M 50 50 L 25 30 L 15 10" stroke="#fb7185" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 50 50 L 75 30 L 85 10" stroke="#fb7185" stroke-width="9" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Gold Medal in Corner -->
  <g transform="translate(480, 50)">
    <polygon points="20,10 30,50 10,50" fill="#dc2626"/>
    <polygon points="40,10 30,50 50,50" fill="#2563eb"/>
    <circle cx="30" cy="65" r="20" fill="#eab308" stroke="#fef08a" stroke-width="3"/>
    <text x="30" y="72" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="16" fill="#713f12" text-anchor="middle">1</text>
  </g>
  <rect x="30" y="32" width="145" height="34" rx="17" fill="#be123c" fill-opacity="0.3" stroke="#fb7185" stroke-width="1.5" />
  <text x="102" y="54" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">ATHLETICS</text>
</svg>