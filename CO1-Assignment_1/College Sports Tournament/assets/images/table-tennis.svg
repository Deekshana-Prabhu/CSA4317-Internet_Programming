<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="ttBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1f38" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="ttGlow" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#ttBg)" />
  <rect width="600" height="400" fill="url(#ttGlow)" />
  <!-- Table Tennis Board in 3D Perspective -->
  <polygon points="60,330 180,180 520,180 440,330" fill="#0369a1" stroke="#ffffff" stroke-width="4" />
  <!-- White Center Dividing Line -->
  <line x1="250" y1="255" x2="350" y2="255" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <!-- Net -->
  <polygon points="120,255 480,255 480,215 120,215" fill="#0f172a" fill-opacity="0.6" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="116" y1="255" x2="116" y2="210" stroke="#94a3b8" stroke-width="4"/>
  <line x1="484" y1="255" x2="484" y2="210" stroke="#94a3b8" stroke-width="4"/>
  <!-- Table Tennis Paddle (Foreground) -->
  <g transform="translate(140, 90) rotate(15)">
    <!-- Wooden Handle -->
    <rect x="52" y="100" width="16" height="50" rx="4" fill="#d97706" stroke="#78350f" stroke-width="2"/>
    <!-- Blade / Rubber Surface -->
    <ellipse cx="60" cy="55" rx="48" ry="52" fill="#dc2626" stroke="#1f2937" stroke-width="4"/>
  </g>
  <!-- Table Tennis Ball (Orange celluloid bouncing) -->
  <circle cx="340" cy="160" r="14" fill="#fb923c" stroke="#ffffff" stroke-width="1"/>
  <circle cx="336" cy="156" r="4" fill="#ffffff" opacity="0.6"/>
  <!-- Bounce arc -->
  <path d="M 280 230 Q 310 120 340 160" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,3"/>
  <rect x="30" y="32" width="165" height="34" rx="17" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
  <text x="112" y="54" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">TABLE TENNIS</text>
</svg>