<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="crickBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091836" />
      <stop offset="100%" stop-color="#020814" />
    </linearGradient>
    <radialGradient id="crickGlow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0.3" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#crickBg)" />
  <rect width="600" height="400" fill="url(#crickGlow)" />
  <!-- Stadium Turf & Pitch Perspective -->
  <polygon points="100,400 240,240 360,240 500,400" fill="url(#pitchGrad)" />
  <line x1="240" y1="240" x2="360" y2="240" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
  <!-- Cricket Wickets & Bails -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="285" y1="230" x2="285" y2="160" />
    <line x1="300" y1="230" x2="300" y2="160" />
    <line x1="315" y1="230" x2="315" y2="160" />
    <line x1="282" y1="158" x2="318" y2="158" stroke="#f59e0b" stroke-width="5" />
  </g>
  <!-- Batsman Action Silhouette -->
  <g fill="#00d2ff" transform="translate(180, 110) scale(1.15)">
    <circle cx="80" cy="25" r="12" />
    <path d="M 80 37 L 85 75 L 110 115 L 125 150" stroke="#00d2ff" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 85 75 L 60 105 L 45 145" stroke="#00d2ff" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 80 48 L 55 68 L 45 92" stroke="#00d2ff" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M 80 48 L 105 65 L 80 96" stroke="#00d2ff" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Cricket Bat Swung High -->
    <line x1="80" y1="96" x2="50" y2="155" stroke="#ff7700" stroke-width="9" stroke-linecap="round" />
  </g>
  <!-- Cricket Leather Ball with Seam & Motion Glow -->
  <g transform="translate(420, 130)">
    <circle cx="20" cy="20" r="26" fill="#dc2626" />
    <path d="M 4 20 Q 20 6 36 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="3,2" />
    <path d="M 4 20 Q 20 34 36 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="3,2" />
    <circle cx="12" cy="14" r="6" fill="#ffffff" opacity="0.3" />
  </g>
  <!-- Sport Label Overlay -->
  <rect x="30" y="32" width="130" height="34" rx="17" fill="#0055ff" fill-opacity="0.3" stroke="#00d2ff" stroke-width="1.5" />
  <text x="95" y="54" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">T20 CRICKET</text>
</svg>