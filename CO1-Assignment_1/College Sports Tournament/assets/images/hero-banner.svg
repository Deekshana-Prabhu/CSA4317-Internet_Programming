<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0a142e" />
      <stop offset="100%" stop-color="#040814" />
    </linearGradient>

    <!-- Stadium Floodlight Radiance -->
    <radialGradient id="lightLeft" cx="15%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0055ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a142e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lightRight" cx="85%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ff3b00" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a142e" stop-opacity="0" />
    </radialGradient>

    <!-- Center Pitch Spotlight -->
    <radialGradient id="pitchSpot" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#050a18" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="beamGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="beamGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1600" height="900" fill="url(#bgGrad)" />

  <!-- Stadium Lights Ambient Glow -->
  <rect width="1600" height="900" fill="url(#lightLeft)" />
  <rect width="1600" height="900" fill="url(#lightRight)" />
  <rect width="1600" height="900" fill="url(#pitchSpot)" />

  <!-- Volumetric Light Beams from Stadium Towers -->
  <polygon points="120,40 500,900 200,900" fill="url(#beamGrad1)" opacity="0.35" />
  <polygon points="180,40 700,900 450,900" fill="url(#beamGrad1)" opacity="0.2" />
  
  <polygon points="1480,40 1100,900 1400,900" fill="url(#beamGrad2)" opacity="0.35" />
  <polygon points="1420,40 900,900 1150,900" fill="url(#beamGrad2)" opacity="0.2" />

  <!-- Stadium Floodlight Towers Structure -->
  <g stroke="#1e293b" stroke-width="3" opacity="0.6">
    <line x1="120" y1="40" x2="60" y2="400" />
    <line x1="160" y1="40" x2="180" y2="400" />
    <line x1="80" y1="120" x2="160" y2="120" />
    <line x1="90" y1="200" x2="170" y2="200" />
    
    <line x1="1480" y1="40" x2="1540" y2="400" />
    <line x1="1440" y1="40" x2="1420" y2="400" />
    <line x1="1440" y1="120" x2="1520" y2="120" />
    <line x1="1430" y1="200" x2="1510" y2="200" />
  </g>

  <!-- Floodlight Light Fixtures -->
  <g fill="#00f2fe" opacity="0.9">
    <circle cx="120" cy="40" r="10" />
    <circle cx="140" cy="40" r="10" />
    <circle cx="160" cy="40" r="10" />
    <circle cx="130" cy="55" r="8" />
    <circle cx="150" cy="55" r="8" />
  </g>
  <g fill="#ff9900" opacity="0.9">
    <circle cx="1480" cy="40" r="10" />
    <circle cx="1460" cy="40" r="10" />
    <circle cx="1440" cy="40" r="10" />
    <circle cx="1470" cy="55" r="8" />
    <circle cx="1450" cy="55" r="8" />
  </g>

  <!-- Stadium Grandstand Tiers / Crowd Silhouette -->
  <path d="M 0 520 Q 400 480 800 500 T 1600 520 L 1600 900 L 0 900 Z" fill="#070d1e" opacity="0.85"/>
  <path d="M 0 580 Q 400 550 800 565 T 1600 580 L 1600 900 L 0 900 Z" fill="#091228" opacity="0.95"/>

  <!-- Stadium Field Curved Lines & Running Track Perspective -->
  <ellipse cx="800" cy="880" rx="720" ry="190" fill="none" stroke="#ff6b35" stroke-width="2.5" opacity="0.4" />
  <ellipse cx="800" cy="880" rx="660" ry="170" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" stroke-dasharray="10,8" />
  <ellipse cx="800" cy="880" rx="600" ry="150" fill="none" stroke="#00d2ff" stroke-width="3" opacity="0.5" />
  <ellipse cx="800" cy="880" rx="540" ry="130" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />

  <!-- Center Turf Grid Lines -->
  <path d="M 800 680 L 800 880" stroke="#00d2ff" stroke-width="3" opacity="0.6" />
  <circle cx="800" cy="780" r="45" fill="none" stroke="#00d2ff" stroke-width="2.5" opacity="0.6" />
  <circle cx="800" cy="780" r="4" fill="#00d2ff" opacity="0.8" />

  <!-- Action Athletes Silhouettes -->
  <!-- Striker Football Player (Right) -->
  <g fill="#ff7700" opacity="0.8" transform="translate(1080, 480) scale(1.15)">
    <circle cx="60" cy="20" r="10" />
    <path d="M 60 32 L 68 65 L 55 100 L 45 130" stroke="#ff7700" stroke-width="10" stroke-linecap="round" fill="none" />
    <path d="M 68 65 L 95 85 L 125 78" stroke="#ff7700" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 62 42 L 35 60 L 15 50" stroke="#ff7700" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 62 42 L 95 38 L 115 50" stroke="#ff7700" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Football in Air with Motion Blur -->
    <circle cx="150" cy="65" r="14" fill="#ffffff" />
    <polygon points="146,60 154,60 156,66 150,70 144,66" fill="#000000" />
    <line x1="128" y1="74" x2="140" y2="70" stroke="#ff7700" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Cricket Batsman / Athlete (Left) -->
  <g fill="#00d2ff" opacity="0.8" transform="translate(360, 470) scale(1.1)">
    <!-- Helmet / Head -->
    <circle cx="80" cy="22" r="11" />
    <!-- Body & Stance -->
    <path d="M 80 34 L 85 70 L 105 110 L 120 140" stroke="#00d2ff" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 85 70 L 60 98 L 45 135" stroke="#00d2ff" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 80 44 L 60 60 L 50 82" stroke="#00d2ff" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 80 44 L 100 58 L 78 86" stroke="#00d2ff" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Cricket Bat -->
    <line x1="78" y1="86" x2="52" y2="135" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    <line x1="78" y1="86" x2="84" y2="76" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sprinter / Runner Center Horizon -->
  <g fill="#ffffff" opacity="0.5" transform="translate(770, 570) scale(0.65)">
    <circle cx="35" cy="20" r="10" />
    <path d="M 35 32 L 48 58 L 30 85 L 15 110" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 48 58 L 75 75 L 98 70" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none" />
    <path d="M 38 42 L 15 50 L 0 65" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 38 42 L 65 35 L 85 45" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Glowing Sparks / Particles -->
  <g fill="#00d2ff" opacity="0.7">
    <circle cx="420" cy="300" r="3" />
    <circle cx="580" cy="220" r="2" />
    <circle cx="950" cy="310" r="2.5" />
    <circle cx="1200" cy="260" r="3" />
    <circle cx="300" cy="450" r="2" />
    <circle cx="1380" cy="420" r="3.5" />
  </g>
  <g fill="#ff7700" opacity="0.7">
    <circle cx="480" cy="280" r="2" />
    <circle cx="700" cy="180" r="3" />
    <circle cx="1080" cy="250" r="2.5" />
    <circle cx="1280" cy="330" r="3" />
    <circle cx="850" cy="400" r="2" />
  </g>
</svg>