<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orangeBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <!-- Hexagon Outer -->
  <polygon points="50,8 86,28 86,72 50,92 14,72 14,28" fill="#082f49" stroke="url(#boltGrad)" stroke-width="3.5"/>
  <!-- Basketball Net Lines -->
  <circle cx="50" cy="50" r="26" fill="#0c4a6e" stroke="#38bdf8" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- Thunder Bolt -->
  <polygon points="54,18 34,50 48,50 44,78 68,42 52,42" fill="url(#orangeBolt)" stroke="#ffffff" stroke-width="1.5"/>
  <text x="50" y="86" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="8" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">THUNDER</text>
</svg>