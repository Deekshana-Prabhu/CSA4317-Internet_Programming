<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - SHOPZONE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', var(--font-family); }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="sidebar-overlay"></div>

    <!-- 1. VERTICAL SIDEBAR NAVIGATION -->
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="brand-link">
                <div class="brand-icon-box">🛍️</div>
                <div class="brand-info">
                    <span class="brand-name">SHOP<span>ZONE</span></span>
                    <span class="brand-tagline">Everything You Need</span>
                </div>
            </a>
        </div>

        <nav class="sidebar-nav">
            <span class="nav-section-title">Menu</span>
            <a href="index.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </a>
            <a href="products.html" class="nav-item">
                <span class="nav-icon">✨</span>
                <span>Browse Products</span>
            </a>
            <a href="cart.html" class="nav-item active">
                <span class="nav-icon">🛒</span>
                <span>Shopping Cart</span>
                <span class="nav-badge">0</span>
            </a>
            <a href="my-orders.html" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>My Orders</span>
            </a>

            <span class="nav-section-title">Categories</span>
            <a href="products.html?category=Electronics" class="nav-item">
                <span class="nav-icon">⚡</span>
                <span>Electronics</span>
            </a>
            <a href="products.html?category=Fashion" class="nav-item">
                <span class="nav-icon">👗</span>
                <span>Fashion</span>
            </a>
            <a href="products.html?category=Home+Appliances" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>Home Appliances</span>
            </a>
            <a href="products.html?category=Books" class="nav-item">
                <span class="nav-icon">📚</span>
                <span>Books</span>
            </a>
            <a href="products.html?category=Accessories" class="nav-item">
                <span class="nav-icon">🎒</span>
                <span>Accessories</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <!-- Rendered by app.js -->
        </div>
    </aside>

    <!-- 2. MAIN CONTENT AREA -->
    <main class="app-main">
        <header class="top-header">
            <button class="mobile-menu-toggle" aria-label="Toggle Sidebar Menu">☰</button>
            <div style="font-size: 18px; font-weight: 800; color: var(--text-main);">Shopping Cart</div>
            <div class="header-actions">
                <a href="products.html" class="btn btn-secondary btn-sm">← Continue Shopping</a>
            </div>
        </header>

        <div class="content-canvas" id="cartContainer">
            <!-- Injected via JavaScript -->
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script src="js/script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', renderCart);

    function renderCart() {
        const cart = ShopDB.getCart();
        const container = document.getElementById('cartContainer');

        if (!cart || cart.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🛒</div>
                    <h3>Your Cart is Currently Empty</h3>
                    <p>Looks like you haven't added anything to your cart yet. Explore our top collections and add products you love!</p>
                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <a href="products.html" class="btn btn-primary btn-lg">Browse Products →</a>
                        <a href="index.html" class="btn btn-secondary btn-lg">Back to Home</a>
                    </div>
                </div>
            `;
            return;
        }

        const totalAmount = ShopDB.getCartTotal();
        const totalItems = ShopDB.getCartCount();

        container.innerHTML = `
            <div class="section-header">
                <div class="section-title-wrap">
                    <h2>Your Shopping Cart</h2>
                    <p>${totalItems} item(s) currently in your order queue</p>
                </div>
                <button onclick="handleClearCart()" class="btn btn-secondary btn-sm" style="color: var(--danger);">
                    🗑️ Clear Cart
                </button>
            </div>

            <div class="cart-layout">
                <div class="cart-card">
                    <div class="cart-card-header">
                        <h3>Items In Cart (${totalItems})</h3>
                        <a href="products.html" class="btn btn-outline btn-sm">+ Add More Items</a>
                    </div>
                    <div class="cart-table-wrapper">
                        <table class="cart-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Unit Price</th>
                                    <th>Quantity</th>
                                    <th>Subtotal</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${cart.map(item => `
                                    <tr>
                                        <td>
                                            <div class="cart-item-info">
                                                <div class="cart-item-thumb">
                                                    <img src="${item.image}" alt="${item.name}">
                                                </div>
                                                <div>
                                                    <div class="cart-item-title">${item.name}</div>
                                                    <div class="cart-item-sub">ID: #${item.productId} • ${item.category}</div>
                                                    <div style="font-size: 11px; color: ${item.stock < 5 ? "var(--warning)" : "var(--success)"}; font-weight: 600; margin-top: 2px;">
                                                        Max Available: ${item.stock}
                                                    </div>
                                                </div>
                                            </div>
                                        </td>
                                        <td style="font-weight: 700; color: var(--text-main);">
                                            ₹${item.price.toLocaleString('en-IN', {minimumFractionDigits: 2})}
                                        </td>
                                        <td>
                                            <div class="cart-qty-form">
                                                <button type="button" class="qty-btn" onclick="updateQty('${item.productId}', ${item.quantity - 1})" ${item.quantity <= 1 ? 'disabled' : ''}>−</button>
                                                <input type="number" value="${item.quantity}" min="1" max="${item.stock}" class="qty-display" onchange="updateQty('${item.productId}', parseInt(this.value) || 1)">
                                                <button type="button" class="qty-btn" onclick="updateQty('${item.productId}', ${item.quantity + 1})" ${item.quantity >= item.stock ? 'disabled' : ''}>+</button>
                                            </div>
                                        </td>
                                        <td style="font-weight: 800; color: var(--primary-blue-hover); font-size: 15px;">
                                            ₹${(item.price * item.quantity).toLocaleString('en-IN', {minimumFractionDigits: 2})}
                                        </td>
                                        <td>
                                            <button onclick="handleRemoveItem('${item.productId}')" class="btn btn-danger btn-sm" title="Remove item">
                                                🗑️
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="summary-card">
                    <h3 class="summary-title">Order Summary</h3>
                    <div class="summary-row">
                        <span>Subtotal (${totalItems} items)</span>
                        <span style="font-weight: 700; color: var(--text-main);">₹${totalAmount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                    </div>
                    <div class="summary-row">
                        <span>Shipping & Delivery</span>
                        <span style="font-weight: 700; color: var(--success);">FREE</span>
                    </div>
                    <div class="summary-row">
                        <span>Applicable Taxes (GST)</span>
                        <span style="font-weight: 600; color: var(--text-muted);">Included</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>Grand Total</span>
                        <span class="price">₹${totalAmount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                    </div>
                    <a href="checkout.html" class="btn btn-primary btn-checkout">
                        Proceed to Checkout →
                    </a>
                    <div style="margin-top: 18px; padding: 12px; background: var(--bg-page); border-radius: var(--radius-md); font-size: 11px; color: var(--text-muted); text-align: center;">
                        🛡️ 100% Purchase Protection & Secure Payment Guaranteed.
                    </div>
                </div>
            </div>
        `;
    }

    function updateQty(productId, qty) {
        const res = ShopDB.updateCartQty(productId, qty);
        if (res && res.adjusted) {
            showToast(`Adjusted quantity to maximum available stock of ${res.max}`, 'warning');
        }
        renderCart();
    }

    function handleRemoveItem(productId) {
        ShopDB.removeFromCart(productId);
        showToast('Item removed from cart.');
        renderCart();
    }

    function handleClearCart() {
        if (confirm('Are you sure you want to empty your entire cart?')) {
            ShopDB.clearCart();
            renderCart();
        }
    }
</script>
</body>
</html>
