<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation - SHOPZONE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', var(--font-family); }
        @media print {
            .app-sidebar, .top-header, .app-footer, .no-print { display: none !important; }
            .app-main { margin-left: 0 !important; }
            .content-canvas { padding: 0 !important; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="sidebar-overlay"></div>

    <!-- 1. VERTICAL SIDEBAR NAVIGATION -->
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="brand-link">
                <div class="brand-icon-box">🛍️</div>
                <div class="brand-info">
                    <span class="brand-name">SHOP<span>ZONE</span></span>
                    <span class="brand-tagline">Everything You Need</span>
                </div>
            </a>
        </div>

        <nav class="sidebar-nav">
            <span class="nav-section-title">Menu</span>
            <a href="index.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </a>
            <a href="products.html" class="nav-item">
                <span class="nav-icon">✨</span>
                <span>Browse Products</span>
            </a>
            <a href="cart.html" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span>Shopping Cart</span>
                <span class="nav-badge">0</span>
            </a>
            <a href="my-orders.html" class="nav-item">
                <span class="nav-icon">📦</span>
                <span>My Orders</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <!-- Rendered by app.js -->
        </div>
    </aside>

    <!-- 2. MAIN CONTENT AREA -->
    <main class="app-main">
        <header class="top-header no-print">
            <button class="mobile-menu-toggle" aria-label="Toggle Sidebar Menu">☰</button>
            <div style="font-size: 18px; font-weight: 800; color: var(--text-main);">Order Receipt & Summary</div>
            <div class="header-actions">
                <a href="products.html" class="btn btn-primary btn-sm">Continue Shopping →</a>
            </div>
        </header>

        <div class="content-canvas" id="orderSuccessContainer">
            <!-- Injected via JavaScript -->
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script src="js/script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const lastOrderStr = sessionStorage.getItem('sz_last_order');
        const container = document.getElementById('orderSuccessContainer');

        let order = lastOrderStr ? JSON.parse(lastOrderStr) : null;
        if (!order) {
            const allOrders = JSON.parse(localStorage.getItem('sz_orders') || '[]');
            if (allOrders.length > 0) order = allOrders[0];
        }

        if (!order) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📋</div>
                    <h3>No Active Order Found</h3>
                    <p>You can view your past orders on the My Orders page.</p>
                    <a href="my-orders.html" class="btn btn-primary">Go to My Orders</a>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="success-container">
                <div class="success-header-card">
                    <div class="success-icon-badge">✓</div>
                    <h2>Order Placed Successfully!</h2>
                    <p>Thank you for shopping with SHOPZONE. Your order has been placed and inventory reserved.</p>
                    <div>
                        <span class="order-id-highlight">Order ID: ${order.orderId}</span>
                    </div>
                </div>

                <div class="cart-card" style="margin-bottom: 24px;">
                    <div class="cart-card-header">
                        <h3>Order Details & Customer Information</h3>
                        <span class="status-badge confirmed">● ${order.orderStatus}</span>
                    </div>
                    
                    <div style="padding: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; background: var(--bg-page); border-bottom: 1px solid var(--border-color);">
                        <div>
                            <span style="font-size: 11px; text-transform: uppercase; color: var(--text-light); font-weight: 700; display: block;">Customer Name</span>
                            <strong style="font-size: 14px; color: var(--text-main);">${order.customerName}</strong>
                            <div style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">ID: ${order.customerId}</div>
                        </div>
                        <div>
                            <span style="font-size: 11px; text-transform: uppercase; color: var(--text-light); font-weight: 700; display: block;">Contact & Mobile</span>
                            <strong style="font-size: 14px; color: var(--text-main);">${order.mobile}</strong>
                        </div>
                        <div>
                            <span style="font-size: 11px; text-transform: uppercase; color: var(--text-light); font-weight: 700; display: block;">Payment Method</span>
                            <strong style="font-size: 14px; color: var(--lavender-hover);">${order.paymentMethod}</strong>
                        </div>
                        <div>
                            <span style="font-size: 11px; text-transform: uppercase; color: var(--text-light); font-weight: 700; display: block;">Order Date</span>
                            <strong style="font-size: 14px; color: var(--text-main);">${order.orderDate}</strong>
                        </div>
                        <div style="grid-column: 1 / -1;">
                            <span style="font-size: 11px; text-transform: uppercase; color: var(--text-light); font-weight: 700; display: block;">Delivery Address</span>
                            <span style="font-size: 13px; color: var(--text-main);">${order.deliveryAddress}</span>
                        </div>
                    </div>

                    <div class="cart-table-wrapper">
                        <table class="cart-table">
                            <thead>
                                <tr>
                                    <th>Product Name</th>
                                    <th>Product ID</th>
                                    <th>Unit Price</th>
                                    <th>Quantity</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${order.items.map(item => `
                                    <tr>
                                        <td>
                                            <div style="display: flex; align-items: center; gap: 10px;">
                                                <img src="${item.productImage}" alt="" style="width: 36px; height: 36px; object-fit: contain; border-radius: 6px; background: var(--bg-page); padding: 2px;">
                                                <span style="font-weight: 700;">${item.productName}</span>
                                            </div>
                                        </td>
                                        <td><span class="product-id-pill">#${item.productId}</span></td>
                                        <td>₹${item.price.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                                        <td style="font-weight: 700;">${item.quantity}</td>
                                        <td style="font-weight: 800; color: var(--primary-blue-hover);">₹${item.subtotal.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div style="padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-page); border-top: 1px solid var(--border-color);">
                        <span style="font-size: 16px; font-weight: 800;">Grand Total Paid:</span>
                        <span style="font-size: 22px; font-weight: 800; color: var(--primary-blue-hover);">₹${order.totalAmount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                    </div>
                </div>

                <div class="no-print" style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
                    <a href="my-orders.html" class="btn btn-primary btn-lg">📦 View My Orders</a>
                    <button onclick="window.print()" class="btn btn-secondary btn-lg">🖨️ Print Order Receipt</button>
                    <a href="products.html" class="btn btn-lavender btn-lg">Continue Shopping →</a>
                </div>
            </div>
        `;
    });
</script>
</body>
</html>
