<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders & Purchase History - SHOPZONE</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', var(--font-family); }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="sidebar-overlay"></div>

    <!-- 1. VERTICAL SIDEBAR NAVIGATION -->
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="brand-link">
                <div class="brand-icon-box">🛍️</div>
                <div class="brand-info">
                    <span class="brand-name">SHOP<span>ZONE</span></span>
                    <span class="brand-tagline">Everything You Need</span>
                </div>
            </a>
        </div>

        <nav class="sidebar-nav">
            <span class="nav-section-title">Menu</span>
            <a href="index.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>Home</span>
            </a>
            <a href="products.html" class="nav-item">
                <span class="nav-icon">✨</span>
                <span>Browse Products</span>
            </a>
            <a href="cart.html" class="nav-item">
                <span class="nav-icon">🛒</span>
                <span>Shopping Cart</span>
                <span class="nav-badge">0</span>
            </a>
            <a href="my-orders.html" class="nav-item active">
                <span class="nav-icon">📦</span>
                <span>My Orders</span>
            </a>

            <span class="nav-section-title">Categories</span>
            <a href="products.html?category=Electronics" class="nav-item">
                <span class="nav-icon">⚡</span>
                <span>Electronics</span>
            </a>
            <a href="products.html?category=Fashion" class="nav-item">
                <span class="nav-icon">👗</span>
                <span>Fashion</span>
            </a>
            <a href="products.html?category=Home+Appliances" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>Home Appliances</span>
            </a>
            <a href="products.html?category=Books" class="nav-item">
                <span class="nav-icon">📚</span>
                <span>Books</span>
            </a>
            <a href="products.html?category=Accessories" class="nav-item">
                <span class="nav-icon">🎒</span>
                <span>Accessories</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <!-- Rendered by app.js -->
        </div>
    </aside>

    <!-- 2. MAIN CONTENT AREA -->
    <main class="app-main">
        <header class="top-header">
            <button class="mobile-menu-toggle" aria-label="Toggle Sidebar Menu">☰</button>
            <div style="font-size: 18px; font-weight: 800; color: var(--text-main);">My Purchase History</div>
            <div class="header-actions">
                <a href="products.html" class="btn btn-primary btn-sm">+ Shop More Products</a>
            </div>
        </header>

        <div class="content-canvas" id="ordersContainer">
            <!-- Injected via JavaScript -->
        </div>
    </main>
</div>

<script src="js/app.js"></script>
<script src="js/script.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = ShopDB.getUser();
        const container = document.getElementById('ordersContainer');

        if (!user) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🔒</div>
                    <h3>Please Log In to View Your Orders</h3>
                    <p>You need to sign in with your customer account to view your past purchases.</p>
                    <div style="display: flex; gap: 12px; justify-content: center;">
                        <a href="login.html" class="btn btn-primary btn-lg">Log In Now →</a>
                        <a href="register.html" class="btn btn-secondary btn-lg">Register Account</a>
                    </div>
                </div>
            `;
            return;
        }

        const orders = ShopDB.getOrdersForUser(user.id);

        if (!orders || orders.length === 0) {
            container.innerHTML = `
                <div class="section-header">
                    <div class="section-title-wrap">
                        <h2>Purchase History for ${user.name}</h2>
                        <p>Customer ID: <strong>${user.id}</strong> • 0 previous orders</p>
                    </div>
                </div>
                <div class="empty-state">
                    <div class="empty-state-icon">📦</div>
                    <h3>No Previous Orders Found</h3>
                    <p>You haven't placed any orders with SHOPZONE yet. Start exploring our catalog today!</p>
                    <a href="products.html" class="btn btn-primary">Browse Catalogue</a>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="section-header">
                <div class="section-title-wrap">
                    <h2>Purchase History for ${user.name}</h2>
                    <p>Customer ID: <strong>${user.id}</strong> • ${orders.length} total order(s) found</p>
                </div>
                <a href="products.html" class="btn btn-primary btn-sm">+ Buy More Products</a>
            </div>

            ${orders.map(o => {
                const statusClass = (o.orderStatus || '').toLowerCase();
                return `
                    <div class="order-history-card">
                        <div class="order-history-header">
                            <div class="order-meta-group">
                                <div class="order-meta-item">
                                    <span class="label">Order ID</span>
                                    <span class="val" style="color: var(--lavender-hover); font-family: monospace;">${o.orderId}</span>
                                </div>
                                <div class="order-meta-item">
                                    <span class="label">Date Placed</span>
                                    <span class="val">${o.orderDate}</span>
                                </div>
                                <div class="order-meta-item">
                                    <span class="label">Payment Method</span>
                                    <span class="val">${o.paymentMethod}</span>
                                </div>
                                <div class="order-meta-item">
                                    <span class="label">Total Amount</span>
                                    <span class="val" style="color: var(--primary-blue-hover); font-size: 15px;">₹${o.totalAmount.toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                                </div>
                            </div>
                            <div>
                                <span class="status-badge ${statusClass}">● ${o.orderStatus}</span>
                            </div>
                        </div>

                        <div class="cart-table-wrapper">
                            <table class="cart-table">
                                <thead>
                                    <tr>
                                        <th>Product Purchased</th>
                                        <th>Product ID</th>
                                        <th>Unit Price</th>
                                        <th>Quantity</th>
                                        <th>Subtotal</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${o.items.map(item => `
                                        <tr>
                                            <td>
                                                <div style="display: flex; align-items: center; gap: 12px;">
                                                    <div style="width: 40px; height: 40px; background: var(--hero-gradient); border-radius: 6px; padding: 4px; display: flex; align-items: center; justify-content: center;">
                                                        <img src="${item.productImage}" alt="" style="max-height: 32px; object-fit: contain;">
                                                    </div>
                                                    <span style="font-weight: 700;">${item.productName}</span>
                                                </div>
                                            </td>
                                            <td><span class="product-id-pill">#${item.productId}</span></td>
                                            <td>₹${item.price.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                                            <td style="font-weight: 700;">${item.quantity}</td>
                                            <td style="font-weight: 800; color: var(--primary-blue-hover);">₹${item.subtotal.toLocaleString('en-IN', {minimumFractionDigits: 2})}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <div style="padding: 12px 22px; background: var(--bg-page); font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                            <span>📍 Delivery To: <strong>${o.customerName}</strong> (${o.mobile}) - ${o.deliveryAddress}</span>
                            <button onclick="viewReceipt('${o.orderId}')" class="btn btn-secondary btn-sm">View Receipt / Invoice</button>
                        </div>
                    </div>
                `;
            }).join('')}

            <footer class="app-footer">
                <div><strong>SHOPZONE</strong> - Online Shopping and Order Management System Using JDBC</div>
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="products.html">Products</a>
                    <a href="cart.html">Cart</a>
                    <a href="my-orders.html">My Orders</a>
                </div>
            </footer>
        `;
    });

    function viewReceipt(orderId) {
        const orders = JSON.parse(localStorage.getItem('sz_orders') || '[]');
        const match = orders.find(o => o.orderId === orderId);
        if (match) {
            sessionStorage.setItem('sz_last_order', JSON.stringify(match));
            window.location.href = 'order-success.html';
        }
    }
</script>
</body>
</html>
