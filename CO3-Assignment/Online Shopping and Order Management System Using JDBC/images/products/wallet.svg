<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" /><stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#451A03" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(200, 150)">
    <!-- Wallet Main Fold -->
    <rect x="-100" y="-60" width="200" height="120" rx="16" fill="url(#leather)" stroke="#92400E" stroke-width="2" />
    <!-- Stitching around edge -->
    <rect x="-93" y="-53" width="186" height="106" rx="12" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 3" />
    <!-- Card Peeking out -->
    <rect x="-60" y="-80" width="120" height="50" rx="6" fill="#3B82F6" stroke="#93C5FD" stroke-width="1.5" />
    <rect x="-45" y="-70" width="24" height="18" rx="4" fill="#F59E0B" />
    <!-- Wallet Flap Pocket -->
    <path d="M -90 -10 C -50 15, 50 15, 90 -10 L 90 50 C 90 55, 85 55, 80 55 L -80 55 C -85 55, -90 55, -90 50 Z" fill="#58240C" stroke="#78350F" stroke-width="2" />
    <circle cx="0" cy="18" r="8" fill="#F59E0B" stroke="#B45309" stroke-width="2" />
  </g>
  <rect x="20" y="20" width="85" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.15" />
  <text x="62" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">ACCESSORY</text>
</svg>
