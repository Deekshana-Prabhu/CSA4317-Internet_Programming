<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.4" /><stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#475569" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(200, 150)">
    <!-- Base -->
    <rect x="-60" y="70" width="120" height="15" rx="6" fill="#1E293B" />
    <!-- Back Spine -->
    <rect x="-55" y="-85" width="40" height="155" rx="8" fill="#334155" />
    <!-- Top Filter Head -->
    <rect x="-60" y="-95" width="120" height="30" rx="10" fill="#1E293B" />
    <!-- Carafe Glass -->
    <path d="M -15 -45 L 35 -45 L 45 40 C 45 60, -25 60, -25 40 Z" fill="url(#glass)" stroke="#64748B" stroke-width="2" />
    <!-- Coffee liquid -->
    <path d="M -18 10 L 38 10 L 42 40 C 42 55, -22 55, -22 40 Z" fill="#78350F" opacity="0.85" />
    <!-- Carafe Handle -->
    <path d="M 40 -30 C 65 -30, 65 30, 38 40" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
    <!-- Indicator light -->
    <circle cx="45" cy="-80" r="4" fill="#10B981" />
  </g>
  <rect x="20" y="20" width="90" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.15" />
  <text x="65" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">APPLIANCE</text>
</svg>
