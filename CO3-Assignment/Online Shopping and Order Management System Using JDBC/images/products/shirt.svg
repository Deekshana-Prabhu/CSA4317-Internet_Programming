<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" /><stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(200, 150)">
    <!-- Sleeves and Body -->
    <path d="M -40 -70 L -100 -20 L -75 25 L -45 5 L -45 85 L 45 85 L 45 5 L 75 25 L 100 -20 L 40 -70 Z" fill="url(#shirtGrad)" />
    <!-- Collar -->
    <path d="M -40 -70 L -15 -45 L 0 -55 L 15 -45 L 40 -70 C 25 -78, -25 -78, -40 -70 Z" fill="#0C4A6E" />
    <!-- Placket Center line -->
    <line x1="0" y1="-50" x2="0" y2="85" stroke="#075985" stroke-width="12" />
    <!-- Buttons -->
    <circle cx="0" cy="-35" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="-10" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="15" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="40" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="65" r="3" fill="#FFFFFF" />
    <!-- Pocket -->
    <rect x="-35" y="-15" width="22" height="26" rx="2" fill="#075985" />
  </g>
  <rect x="20" y="20" width="75" height="26" rx="13" fill="#0284C7" fill-opacity="0.15" />
  <text x="57" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">FASHION</text>
</svg>
