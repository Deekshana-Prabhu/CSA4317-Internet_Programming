<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#EC4899" /><stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(190, 150)">
    <!-- Sole -->
    <path d="M -110 50 C -60 55, 60 55, 110 50 C 120 48, 125 40, 115 35 C 90 35, 60 38, 20 38 C -40 38, -90 30, -115 35 C -120 40, -118 48, -110 50 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    <!-- Air cushion bubble -->
    <rect x="-85" y="38" width="45" height="9" rx="4" fill="#38BDF8" fill-opacity="0.7" />
    <!-- Main Shoe Upper -->
    <path d="M -112 35 C -105 10, -85 -20, -50 -20 C -35 -20, -20 -5, 0 10 C 30 18, 70 25, 115 35 C 110 38, -100 38, -112 35 Z" fill="url(#shoeGrad)" />
    <!-- Ankle Collar -->
    <path d="M -60 -20 C -50 -40, -20 -35, -15 -10" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round" />
    <!-- Laces -->
    <path d="M -25 -5 L -10 5 M -15 -10 L 0 0 M -5 -15 L 10 -5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <!-- Dynamic Swoosh / Stripe -->
    <path d="M -70 15 Q -10 0 50 25" fill="none" stroke="#FDE047" stroke-width="5" stroke-linecap="round" />
  </g>
  <rect x="20" y="20" width="75" height="26" rx="13" fill="#EC4899" fill-opacity="0.15" />
  <text x="57" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#DB2777" text-anchor="middle">FASHION</text>
</svg>
