<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" /><stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4F46E5" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(200, 140)">
    <!-- Screen Lid -->
    <rect x="-110" y="-75" width="220" height="135" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <!-- Display area -->
    <rect x="-100" y="-67" width="200" height="118" rx="4" fill="url(#screenGrad)" />
    <!-- Screen Graphic code lines -->
    <circle cx="0" cy="-20" r="16" fill="#8B5CF6" fill-opacity="0.4" />
    <path d="M -8 -20 L -3 -15 L 8 -26" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <rect x="-60" y="8" width="120" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="-40" y="22" width="80" height="6" rx="3" fill="#93C5FD" fill-opacity="0.7" />
    <!-- Webcam -->
    <circle cx="0" cy="-71" r="2.5" fill="#64748B" />
    <!-- Laptop Base -->
    <path d="M -130 60 L 130 60 L 145 74 C 145 78, 140 82, 135 82 L -135 82 C -140 82, -145 78, -145 74 Z" fill="#94A3B8" />
    <!-- Base front indent -->
    <rect x="-30" y="61" width="60" height="4" rx="2" fill="#64748B" />
  </g>
  <rect x="20" y="20" width="70" height="26" rx="13" fill="#3B82F6" fill-opacity="0.15" />
  <text x="55" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">LAPTOP</text>
</svg>
