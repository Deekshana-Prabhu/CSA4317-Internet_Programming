<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" /><stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4338CA" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(200, 150)">
    <!-- Top Handle -->
    <path d="M -30 -85 C -30 -115, 30 -115, 30 -85" fill="none" stroke="#312E81" stroke-width="8" stroke-linecap="round" />
    <!-- Main Body -->
    <path d="M -65 90 C -75 30, -70 -70, 0 -75 C 70 -70, 75 30, 65 90 Z" fill="url(#bagGrad)" />
    <!-- Front Pocket -->
    <path d="M -50 90 C -55 40, -50 10, 0 8 C 50 10, 55 40, 50 90 Z" fill="#4F46E5" stroke="#818CF8" stroke-width="2" />
    <!-- Zipper accents -->
    <path d="M -40 25 Q 0 35 40 25" fill="none" stroke="#A5B4FC" stroke-width="3" stroke-dasharray="4 2" />
    <path d="M -45 -35 Q 0 -25 45 -35" fill="none" stroke="#C7D2FE" stroke-width="3" stroke-dasharray="5 3" />
    <!-- Leather patch badge -->
    <rect x="-18" y="45" width="36" height="24" rx="4" fill="#D97706" />
    <circle cx="-10" cy="57" r="2" fill="#FEF3C7" />
    <circle cx="10" cy="57" r="2" fill="#FEF3C7" />
  </g>
  <rect x="20" y="20" width="85" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.15" />
  <text x="62" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7C3AED" text-anchor="middle">ACCESSORY</text>
</svg>
