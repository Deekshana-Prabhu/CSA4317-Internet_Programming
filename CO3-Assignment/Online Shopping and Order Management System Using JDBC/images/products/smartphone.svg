<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" /><stop offset="50%" stop-color="#8B5CF6" /><stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(200, 150)">
    <!-- Phone Body -->
    <rect x="-55" y="-105" width="110" height="210" rx="22" fill="#0F172A" stroke="#64748B" stroke-width="3" />
    <!-- Screen -->
    <rect x="-50" y="-100" width="100" height="200" rx="18" fill="url(#screenGrad)" />
    <!-- Camera punch hole -->
    <circle cx="0" cy="-88" r="4" fill="#0F172A" />
    <!-- Lockscreen / UI elements -->
    <text x="0" y="-45" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">12:30</text>
    <text x="0" y="-28" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#E2E8F0" text-anchor="middle">Wednesday, Nov 18</text>
    <!-- App icons grid -->
    <rect x="-35" y="10" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="-10" y="10" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="15" y="10" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="-35" y="34" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="-10" y="34" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="15" y="34" width="16" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.4" />
    <!-- Home Bar -->
    <rect x="-20" y="85" width="40" height="4" rx="2" fill="#FFFFFF" />
  </g>
  <rect x="20" y="20" width="75" height="26" rx="13" fill="#3B82F6" fill-opacity="0.15" />
  <text x="57" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">5G MOBILE</text>
</svg>
