  <rect x="20" y="20" width="75" height="26" rx="13" fill="#3B82F6" fill-opacity="0.15" />
  <text x="57" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">SPEAKER</text>
