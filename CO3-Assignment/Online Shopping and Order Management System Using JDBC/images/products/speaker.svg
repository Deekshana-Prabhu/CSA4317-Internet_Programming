    <ellipse cx="0" cy="-35" rx="45" ry="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
    <ellipse cx="0" cy="0" rx="48" ry="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
    <ellipse cx="0" cy="35" rx="45" ry="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2" />
    <ellipse cx="0" cy="-80" rx="40" ry="14" fill="#1E293B" stroke="#60A5FA" stroke-width="3" />
    <circle cx="0" cy="0" r="16" fill="#1E293B" stroke="#93C5FD" stroke-width="2" />
    <path d="M 0 -8 L 0 8 M -8 0 L 8 0" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
