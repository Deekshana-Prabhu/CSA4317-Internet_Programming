<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#475569" flood-opacity="0.2" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(200, 150)">
    <!-- Microwave body -->
    <rect x="-120" y="-75" width="240" height="150" rx="16" fill="#1E293B" stroke="#475569" stroke-width="3" />
    <!-- Glass Window -->
    <rect x="-105" y="-60" width="145" height="120" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2" />
    <circle cx="-32" cy="0" r="30" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="10 6" opacity="0.6" />
    <!-- Control panel -->
    <rect x="52" y="-60" width="55" height="120" rx="6" fill="#334155" />
    <!-- Digital Display -->
    <rect x="57" y="-52" width="45" height="22" rx="4" fill="#000000" />
    <text x="79" y="-36" font-family="monospace" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">02:30</text>
    <!-- Buttons -->
    <circle cx="68" cy="-14" r="5" fill="#64748B" />
    <circle cx="91" cy="-14" r="5" fill="#64748B" />
    <circle cx="68" cy="2" r="5" fill="#64748B" />
    <circle cx="91" cy="2" r="5" fill="#64748B" />
    <!-- Dial -->
    <circle cx="79" cy="32" r="14" fill="#475569" stroke="#94A3B8" stroke-width="2" />
    <!-- Start Button -->
    <rect x="62" y="52" width="35" height="6" rx="3" fill="#3B82F6" />
  </g>
  <rect x="20" y="20" width="90" height="26" rx="13" fill="#3B82F6" fill-opacity="0.15" />
  <text x="65" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">APPLIANCE</text>
</svg>
