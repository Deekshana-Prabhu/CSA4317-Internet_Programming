<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)" />
  <g filter="url(#shadow)" transform="translate(200, 150)">
    <!-- Headband -->
    <path d="M -80 0 A 80 80 0 0 1 80 0" fill="none" stroke="url(#headphoneGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Inner soft pad -->
    <path d="M -60 -30 A 68 68 0 0 1 60 -30" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" opacity="0.8" />
    <!-- Left ear cup bracket -->
    <rect x="-92" y="-10" width="14" height="40" rx="6" fill="#1E293B" />
    <!-- Right ear cup bracket -->
    <rect x="78" y="-10" width="14" height="40" rx="6" fill="#1E293B" />
    <!-- Left ear cup -->
    <ellipse cx="-85" cy="30" rx="22" ry="42" fill="url(#headphoneGrad)" />
    <ellipse cx="-85" cy="30" rx="14" ry="30" fill="#1E293B" />
    <ellipse cx="-85" cy="30" rx="6" ry="16" fill="#60A5FA" />
    <!-- Right ear cup -->
    <ellipse cx="85" cy="30" rx="22" ry="42" fill="url(#headphoneGrad)" />
    <ellipse cx="85" cy="30" rx="14" ry="30" fill="#1E293B" />
    <ellipse cx="85" cy="30" rx="6" ry="16" fill="#60A5FA" />
    <!-- Soundwaves -->
    <path d="M -125 15 A 25 25 0 0 0 -125 45" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M 125 15 A 25 25 0 0 1 125 45" fill="none" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
  <rect x="20" y="20" width="80" height="26" rx="13" fill="#3B82F6" fill-opacity="0.15" />
  <text x="60" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">WIRELESS</text>
</svg>
