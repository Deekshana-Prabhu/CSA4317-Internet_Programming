<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" /><stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" /><stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369A1" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)" />
  <g filter="url(#drop)" transform="translate(200, 150)">
    <rect x="-65" y="-85" width="145" height="170" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <rect x="-75" y="-90" width="140" height="180" rx="8" fill="url(#coverGrad)" />
    <line x1="-55" y1="-90" x2="-55" y2="90" stroke="#075985" stroke-width="4" />
    <text x="-5" y="-15" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">&lt; / &gt;</text>
    <text x="-5" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">CLEAN CODE</text>
    <text x="-5" y="35" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#BAE6FD" text-anchor="middle">A HANDBOOK</text>
    <rect x="-35" y="50" width="60" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.5" />
  </g>
  <rect x="20" y="20" width="65" height="26" rx="13" fill="#0284C7" fill-opacity="0.15" />
  <text x="52" y="37" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">BOOKS</text>
</svg>
